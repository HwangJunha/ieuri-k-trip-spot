# 머지되면 설치 가능한 산출물을 만든다.
#
# **PR 검증(dev-check·release-check)과 역할이 다르다.** 그쪽은 "머지해도 되는가"를
# 보고, 이쪽은 "받아서 올릴 수 있는 파일"을 만든다. 그래서 여기서는 서명하고
# 환경값을 주입한다.
#
# | 브랜치 | Android | iOS |
# |---|---|---|
# | dev    | dev flavor, **APK만** (내부 테스트) | **돌지 않는다** |
# | master | prod flavor, APK + AAB (스토어 업로드) | 서명 없이 빌드 확인 |
#
# 둘 다 릴리스 키로 서명한다 — 서명이 없으면 스토어에 올릴 수 없고, 디버그 키로
# 떨어진 것을 모른 채 지나가면 업로드 단계에서야 알게 된다.
#
# **iOS는 master에서만 돈다**(사용자 결정 2026-08-25). macOS 러너가 분당 10배로
# 과금되는데, dev 머지마다 돌리면 그 비용이 실제 이득을 넘는다 — iOS 빌드가
# 깨졌는지는 출시 직전에 알아도 늦지 않고, 개발 중에는 로컬에서 계속 빌드한다.
#
# **iOS는 서명하지 않는다.** 인증서·프로비저닝 프로파일을 CI에 올리는 것은
# 별개 작업이라(Fastlane match 등) `--no-codesign`으로 빌드만 확인하고,
# TestFlight에 올릴 ipa는 로컬에서 만든다. 붙일 때가 되면 이 파일에 서명 단계를
# 더하면 된다.
name: build

on:
  push:
    branches: [dev, master]
  # 필요할 때 손으로도 돌린다 — 재빌드가 필요한데 커밋할 것은 없는 경우.
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    # **60분이다.** 30분으로 뒀다가 첫 실행이 빌드 도중 잘렸다(2026-08-24, exit 143).
    # Gradle 캐시가 비어 있으면 의존성을 통째로 받고, 그 뒤 APK와 AAB를 각각
    # 빌드하므로 첫 실행은 30분을 넘긴다. 캐시가 서면 10분 안쪽으로 떨어진다.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      # **Gradle 캐시가 없으면 매번 의존성을 통째로 받는다.** 첫 실행이 30분
      # 타임아웃에 걸린 주된 이유이고, 캐시가 서면 빌드가 몇 분대로 떨어진다.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # 브랜치로 환경을 가른다. master면 운영, 그 외에는 개발이다.
      - name: 환경 결정
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "flavor=prod" >> "$GITHUB_OUTPUT"
            echo "env_secret=ENV_PROD" >> "$GITHUB_OUTPUT"
          else
            echo "flavor=dev" >> "$GITHUB_OUTPUT"
            echo "env_secret=ENV_DEV" >> "$GITHUB_OUTPUT"
          fi

      # `.env`는 커밋되지 않으므로 시크릿에서 복원한다. 없으면 빌드는 되지만
      # 서버 주소·SNS 키가 비어 앱이 제 기능을 못 하므로 명시적으로 실패시킨다.
      - name: 환경 파일 복원
        env:
          ENV_CONTENT: ${{ github.ref_name == 'master' && secrets.ENV_PROD || secrets.ENV_DEV }}
        run: |
          if [ -z "$ENV_CONTENT" ]; then
            echo "::error::${{ steps.env.outputs.env_secret }} 시크릿이 비어 있다"
            exit 1
          fi
          printf '%s' "$ENV_CONTENT" > ".env.${{ steps.env.outputs.flavor }}"
          echo "복원: .env.${{ steps.env.outputs.flavor }}"

      # 릴리스 키로 서명해야 스토어에 올릴 수 있다. 키는 base64로 시크릿에 넣고
      # 여기서 되돌린다 — 바이너리를 그대로 시크릿에 넣을 수 없다.
      - name: 서명 키 복원
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 시크릿이 비어 있다 — 서명 없이는 올릴 수 없다"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 의존성
        run: flutter pub get

      - name: 코드 생성
        run: dart run build_runner build --delete-conflicting-outputs

      # **APK는 항상, AAB는 master에서만.**
      #
      # AAB는 Play 업로드 형식이라 스토어에 올릴 때만 필요하고, dev 산출물은
      # 기기에 직접 설치해 보는 용도라 APK 하나면 된다. 둘 다 만들면 빌드가
      # 통째로 두 번 도는데, 첫 실행이 APK 하나에 711초였다(2026-08-24) — dev
      # 머지마다 그 두 배를 쓸 이유가 없다.
      - name: 빌드
        run: |
          F="${{ steps.env.outputs.flavor }}"
          flutter build apk --release --flavor "$F" --dart-define-from-file=".env.$F"
          if [ "${{ github.ref_name }}" = "master" ]; then
            flutter build appbundle --release --flavor "$F" --dart-define-from-file=".env.$F"
          fi

      # 디버그 키로 떨어졌으면 스토어에 못 올린다 — 조용히 넘어가면 업로드
      # 단계에서야 알게 된다.
      - name: 서명 확인
        run: |
          APK=$(find build/app/outputs/flutter-apk -name "*-release.apk" | head -1)
          DN=$("$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" 2>/dev/null \
               | grep -m1 "certificate DN" || true)
          echo "$DN"
          case "$DN" in
            *"Android Debug"*)
              echo "::error::디버그 키로 서명됐다 — 스토어에 올릴 수 없다"; exit 1;;
          esac
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" 2>/dev/null \
            | grep -m1 "SHA-1" | sed 's/^/릴리스 /'

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ steps.env.outputs.flavor }}-${{ github.sha }}
          # AAB는 master에서만 생긴다(위 빌드 단계) — dev에서는 APK만 담긴다.
          path: |
            build/app/outputs/flutter-apk/*-release.apk
            build/app/outputs/bundle/**/*.aab
          retention-days: 30
          # APK는 어느 브랜치에서도 반드시 있어야 한다. 하나도 없으면 빌드가
          # 조용히 실패한 것이다.
          if-no-files-found: error

  ios:
    # **master로 머지될 때만 돈다.** macOS 러너는 분당 10배 과금이라 dev마다
    # 돌리면 무료 한도가 빠르게 마른다(위 헤더).
    if: github.ref_name == 'master'
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: 환경 결정
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "flavor=prod" >> "$GITHUB_OUTPUT"
          else
            echo "flavor=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: 환경 파일 복원
        env:
          ENV_CONTENT: ${{ github.ref_name == 'master' && secrets.ENV_PROD || secrets.ENV_DEV }}
        run: |
          if [ -z "$ENV_CONTENT" ]; then
            echo "::error::환경 시크릿이 비어 있다"
            exit 1
          fi
          printf '%s' "$ENV_CONTENT" > ".env.${{ steps.env.outputs.flavor }}"

      - name: 의존성
        run: flutter pub get

      - name: 코드 생성
        run: dart run build_runner build --delete-conflicting-outputs

      # 서명 없이 빌드한다(위 헤더 참고). TestFlight에 올릴 ipa는 인증서가 있는
      # 로컬에서 만든다.
      - name: 빌드
        run: |
          F="${{ steps.env.outputs.flavor }}"
          flutter build ios --release --flavor "$F" --no-codesign \
            --dart-define-from-file=".env.$F"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ steps.env.outputs.flavor }}-${{ github.sha }}
          path: build/ios/iphoneos/Runner.app
          retention-days: 30
          if-no-files-found: error
