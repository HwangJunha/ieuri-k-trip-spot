# dev로 들어오는 모든 PR의 기본 검증.
#
# **가볍게 유지한다.** private 저장소라 Actions 분이 과금되고, 이 워크플로는 가장
# 자주 돈다. 빌드(apk/ipa)는 여기서 하지 않는다 — 문법·타입·테스트가 깨지는 것은
# 아래로 다 잡히고, 네이티브 빌드는 master로 갈 때와 출시 때 확인한다.
#
# **러너는 ubuntu만 쓴다.** macOS 러너는 분당 10배 과금인데, `flutter test`는
# Dart VM에서 돌아 플랫폼을 타지 않는다.
name: dev check

on:
  pull_request:
    branches: [dev]

# 같은 PR에 새 커밋이 올라오면 이전 실행을 취소한다 — 어차피 최신 커밋만 보면
# 되고, 그대로 두면 분을 두 배로 쓴다.
concurrency:
  group: dev-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: 의존성
        run: flutter pub get

      # **생성 파일은 커밋되지 않는다**(.gitignore — *.g.dart, *.graphql.dart).
      # 이 단계를 빼면 컴파일 자체가 안 된다.
      - name: 코드 생성
        run: dart run build_runner build --delete-conflicting-outputs

      # `lib`과 `test`만 본다. `build/`에는 벤더 SDK 소스가 딸려 들어와
      # 남의 코드 오류 수천 건이 잡힌다.
      - name: 정적 분석
        run: flutter analyze lib test

      - name: 테스트
        run: flutter test
