# dev → master(출시 브랜치) PR의 검증.
#
# dev 검증에 **출시 직전에만 의미가 있는 것**을 얹는다 — 스토어에 올라간 뒤에야
# 드러나는 종류(앱 이름이 기본값, 권한 사유 문구 누락, 다국어 키 한 언어만 빠짐)와
# **네이티브 빌드가 실제로 되는지**다.
#
# **`flutter analyze`가 통과해도 네이티브 빌드는 깨진다.** 실제로 겪은 것들:
# `resValues = true` 누락(Gradle에서만 실패), `GeneratedPluginRegistrant.java`
# 잔재(릴리스 빌드에서만 실패), Podfile flavor 구성 누락(링크 단계 실패).
# 이 종류는 빌드를 돌려야만 잡힌다.
#
# **서명은 하지 않는다.** CI에 릴리스 키를 두지 않으므로 디버그 키로 서명되고
# 산출물은 버린다 — 여기서 확인하는 것은 "빌드가 되는가"이지 "올릴 수 있는가"가
# 아니다. 실제 출시 빌드는 키가 있는 로컬에서 만든다.
#
# **iOS는 `ios/`가 바뀐 PR에서만 돈다.** macOS 러너가 분당 10배라 매번 돌리면
# 무료 한도를 태운다 — 대부분의 PR은 iOS를 건드리지 않는다.
name: release check

on:
  pull_request:
    branches: [master]

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: 의존성
        run: flutter pub get

      - name: 코드 생성
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 정적 분석
        run: flutter analyze lib test

      - name: 테스트
        run: flutter test

      # ── 여기서부터 출시 전용 점검 ──────────────────────────────────────────

      # 4개 언어(ko/en/ja/zh)의 키가 하나라도 어긋나면 그 화면만 영어로 뜬다.
      # 외국인 대상 앱이라 이건 기능 결함에 가깝다.
      - name: 다국어 키 정합성
        run: |
          python3 - <<'PY'
          import json, sys

          locales = ['ko', 'en', 'ja', 'zh']
          keys = {}
          for loc in locales:
              with open(f'lib/l10n/app_{loc}.arb', encoding='utf-8') as f:
                  data = json.load(f)
              keys[loc] = {k for k in data if not k.startswith('@')}

          base = keys['ko']
          failed = False
          for loc in locales[1:]:
              missing = base - keys[loc]
              extra = keys[loc] - base
              if missing or extra:
                  failed = True
                  if missing:
                      print(f'::error::{loc}에 없는 키 {len(missing)}개: {sorted(missing)[:5]}')
                  if extra:
                      print(f'::error::{loc}에만 있는 키 {len(extra)}개: {sorted(extra)[:5]}')

          if failed:
              sys.exit(1)
          print(f'4개 언어 {len(base)}키 일치')
          PY

      # 스토어에 기본값이 올라가는 사고를 막는다. 실제로 앱 이름이
      # `ieuri_k_trip_spot`인 채로 있었다(2026-08-24).
      - name: 출시 설정 점검
        run: |
          fail=0

          # 앱 이름은 flavor별 resValue로 정해진다(매니페스트는 @string/app_name).
          # 운영 flavor의 값만 본다 — dev는 "KTS Dev"인 게 정상이다.
          label=$(grep -A3 'create("prod")' android/app/build.gradle.kts \
                  | grep -oE '"app_name", "[^"]*"' | sed 's/.*, "//;s/"//')
          case "$label" in
            ''|*example*|*_*)
              echo "::error::운영 앱 이름이 비었거나 기본값처럼 보인다: '$label'"; fail=1;;
            *) echo "운영 앱 이름: $label";;
          esac

          appid=$(grep -oE 'applicationId = "[^"]*"' android/app/build.gradle.kts | head -1 | cut -d'"' -f2)
          case "$appid" in
            com.example.*|'')
              echo "::error::Android applicationId가 기본값이다: '$appid'"; fail=1;;
            *) echo "Android applicationId: $appid";;
          esac

          # **운영 flavor에 접미사가 붙으면 안 된다.** 붙은 채로 스토어에 올리면
          # 되돌릴 수 없다 — applicationId는 앱의 정체성이다.
          if grep -A3 'create("prod")' android/app/build.gradle.kts | grep -q 'applicationIdSuffix'; then
            echo "::error::운영 flavor에 applicationIdSuffix가 있다 — 스토어 id가 바뀐다"; fail=1
          else
            echo "운영 flavor 접미사 없음"
          fi

          # iOS 권한 사유 문구 — 비어 있으면 앱스토어 심사에서 반려된다.
          for key in NSLocationWhenInUseUsageDescription NSPhotoLibraryUsageDescription; do
            if ! /usr/bin/env python3 - "$key" <<'PY'
          import plistlib, sys
          with open('ios/Runner/Info.plist', 'rb') as f:
              plist = plistlib.load(f)
          key = sys.argv[1]
          value = plist.get(key, '')
          if not value or len(value) < 30:
              print(f'::error::{key}가 없거나 너무 짧다 — 심사에서 반려된다')
              sys.exit(1)
          print(f'{key}: {len(value)}자')
          PY
            then fail=1; fi
          done

          exit $fail

      # 생성 파일이 실수로 다시 추적되는 것을 막는다. 커밋되면 소스를 고치고
      # codegen을 빼먹어도 diff에 아무 표시가 안 남는다(2026-08-24 사고).
      - name: 생성 파일이 추적되지 않는지
        run: |
          tracked=$(git ls-files | grep -E '\.g\.dart$|\.graphql\.dart$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::생성 파일이 추적되고 있다:"
            echo "$tracked" | head -5
            exit 1
          fi
          echo "생성 파일 추적 없음"

  # ── ② 빌드 검증 ─────────────────────────────────────────────────────────────
  #
  # 운영 flavor로 실제 빌드한다. `verify`가 통과한 뒤에만 돈다 — 테스트가 깨진
  # 코드를 빌드해 봐야 분만 쓴다.
  build-android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: 의존성
        run: flutter pub get

      - name: 코드 생성
        run: dart run build_runner build --delete-conflicting-outputs

      # **`--dart-define` 없이 빌드한다.** 주입값은 전부 공개 식별자거나 개발
      # 서버용이고, 여기서 보려는 것은 "빌드가 되는가"다. 값이 없어도 앱은
      # 기동되도록 설계돼 있다(설계 §10 — 키가 없으면 해당 화면만 안내를 띄운다).
      #
      # **서명은 디버그 키로 떨어진다**(key.properties가 CI에 없다). 그 산출물은
      # 스토어에 못 올리지만, Gradle 설정·네이티브 의존성이 성립하는지는 똑같이
      # 검증된다.
      - name: 운영 APK 빌드
        run: flutter build apk --release --flavor prod

  # iOS는 `ios/`가 바뀐 PR에서만 돈다 — macOS 러너가 분당 10배다.
  changed:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" | grep -qE '^(ios/|pubspec\.(yaml|lock)$)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "iOS 관련 변경 있음 — 빌드한다"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
            echo "iOS 관련 변경 없음 — 빌드를 건너뛴다"
          fi

  build-ios:
    needs: [verify, changed]
    if: needs.changed.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: 의존성
        run: flutter pub get

      - name: 코드 생성
        run: dart run build_runner build --delete-conflicting-outputs

      # 서명 없이 빌드한다 — CI에 인증서를 두지 않는다. Podfile 구성·xcconfig·
      # 빌드 단계가 성립하는지는 이것으로 확인된다.
      - name: 운영 iOS 빌드
        run: flutter build ios --release --flavor prod --no-codesign
