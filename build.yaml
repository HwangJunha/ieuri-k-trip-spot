targets:
  $default:
    builders:
      graphql_codegen:
        options:
          # Match the shared client (common/network): no cache/normalization,
          # so responses need not carry __typename.
          addTypename: false
          # Generated code follows GraphQL naming ($, SCREAMING_CASE), not Dart
          # lint style — silence the analyzer for these files.
          generatedFileHeader: |
            // GENERATED CODE - DO NOT MODIFY BY HAND
            // ignore_for_file: type=lint, unused_import, unused_element
          scalars:
            _FieldSet:
              type: Object
        generate_for:
          # 둘 이상의 기능이 쓰는 타입 조각. codegen이 모든 조각을 한 네임스페이스로
          # 합치므로 생성 타입의 집은 하나뿐이고, 그 집이 어느 기능 폴더에 있으면
          # 다른 기능이 그 폴더를 import하게 된다(CLAUDE.md §3). 공용은 공용 자리에 둔다.
          - lib/common/network/shared_schema.graphql
          - lib/domain/auth/repository/auth_operations.graphql
          - lib/domain/auth/repository/auth_schema.graphql
          - lib/domain/spot/repository/spot_operations.graphql
          - lib/domain/spot/repository/spot_schema.graphql
          # SPEC-0013 R17. Festival 타입은 SpotCategory·CopyrightType을 참조하는데,
          # codegen이 모든 조각을 하나로 병합하므로 spot 쪽 정의를 그대로 쓴다.
          - lib/domain/event/repository/event_operations.graphql
          - lib/domain/event/repository/event_schema.graphql
          - lib/domain/community/repository/community_operations.graphql
          - lib/domain/community/repository/community_schema.graphql
          - lib/domain/settings/repository/settings_operations.graphql
          - lib/domain/settings/repository/settings_schema.graphql
          - lib/domain/settings/repository/profile_operations.graphql
          - lib/domain/settings/repository/profile_schema.graphql
          - lib/domain/settings/repository/email_change_operations.graphql
          - lib/domain/settings/repository/email_change_schema.graphql
          # SPEC-0014 지도·혼잡도. MapSpot/SpotCluster가 SpotCategory를 참조하는데,
          # codegen이 조각을 하나로 병합하므로 spot 쪽 정의를 그대로 쓴다.
          - lib/domain/map/repository/map_operations.graphql
          - lib/domain/map/repository/map_schema.graphql
          # SPEC-0017 피드·DM. PostAuthor·PostSpot·PageInfo·UserError·ReportReason은
          # 다른 조각이 이미 선언하므로 참조만 한다. Subscription 루트는 여기가 최초다.
          - lib/domain/feed/repository/feed_operations.graphql
          - lib/domain/feed/repository/feed_schema.graphql
