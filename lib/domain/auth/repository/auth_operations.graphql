# Auth GraphQL operations (real server schema — schema/schema.graphql).
# graphql_codegen turns each operation into typed classes in
# auth_operations.graphql.dart. These generated types stay inside the
# repository (CLAUDE.md §3) — the repository maps them to domain models.

mutation RegisterEmailMember($input: RegisterEmailMemberInput!) {
  registerEmailMember(input: $input) {
    success
    userErrors {
      code
      codeValue
      message
      field
    }
    verificationId
  }
}

mutation VerifyEmail($input: VerifyEmailInput!) {
  verifyEmail(input: $input) {
    success
    userErrors {
      code
      codeValue
      message
      field
    }
    verified
    failureReason
  }
}

mutation ResendVerification($input: ResendVerificationInput!) {
  resendVerification(input: $input) {
    success
    userErrors {
      code
      codeValue
      message
      field
    }
    verificationId
    expiresAt
  }
}

# 인증 주소 재입력(SPEC-0024 R7). 인증을 마치기 전 상태에서만 쓰며 가입 유형을
# 가리지 않는다 — 이메일 가입자와 provider 무이메일 SNS 가입자가 함께 쓴다.
# 성공하면 이전 코드가 무효화되고 새 verificationId가 나오므로 들고 있던 핸들을
# 갈아 끼워야 한다.
mutation RetargetEmailVerification($input: RetargetEmailVerificationInput!) {
  retargetEmailVerification(input: $input) {
    success
    userErrors {
      code
      codeValue
      message
      field
    }
    verificationId
    expiresAt
  }
}

