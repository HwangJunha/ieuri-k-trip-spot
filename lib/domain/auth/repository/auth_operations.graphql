# Auth GraphQL operations (real server schema — schema/schema.graphql).
# graphql_codegen turns each operation into typed classes in
# auth_operations.graphql.dart. These generated types stay inside the
# repository (CLAUDE.md §3) — the repository maps them to domain models.

mutation RegisterEmailMember($input: RegisterEmailMemberInput!) {
  registerEmailMember(input: $input) {
    success
    userErrors {
      code
      message
      field
    }
    verificationId
  }
}

mutation VerifyEmail($input: VerifyEmailInput!) {
  verifyEmail(input: $input) {
    success
    userErrors {
      code
      message
      field
    }
    verified
    failureReason
  }
}

mutation ResendVerification($input: ResendVerificationInput!) {
  resendVerification(input: $input) {
    success
    userErrors {
      code
      message
      field
    }
    verificationId
    expiresAt
  }
}

mutation RegisterSnsMember($input: RegisterSnsMemberInput!) {
  registerSnsMember(input: $input) {
    success
    userErrors {
      code
      message
      field
    }
    emailVerified
    verificationId
  }
}

mutation LoginSns($input: LoginSnsInput!) {
  loginSns(input: $input) {
    success
    userErrors {
      code
      message
      field
    }
    accessToken
    refreshToken
    tokenType
    accessTokenExpiresIn
    refreshTokenExpiresIn
  }
}

