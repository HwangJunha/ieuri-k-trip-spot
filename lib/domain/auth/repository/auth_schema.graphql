enum TermsCode {
  SERVICE
  PRIVACY
  LOCATION
  MARKETING
}

type UserError {
  # 정본. 서버가 스키마보다 앞선 코드를 낼 수 있으므로 이 값이 항상 채워진다.
  code: String!
  # 같은 값의 enum(SPEC-0024 R6-6). 분기는 이쪽으로 하고, 스키마에 없는 코드가
  # 오면 null이 되므로 그때 [code]로 폴백한다.
  codeValue: ErrorCode
  message: String!
  field: String
}

# userErrors[].code의 알려진 값(SPEC-0024). 서버가 새 코드를 추가해도 응답이
# 깨지지 않도록 UserError.codeValue는 nullable이다.
enum ErrorCode {
  INVALID_INPUT
  # 비밀번호가 정책에 맞지 않다. 이전에는 INVALID_INPUT으로 왔다(서버 BREAKING).
  # 이 코드가 오면 `field`가 어느 입력인지 가리킨다.
  PASSWORD_POLICY_VIOLATION
  MEMBER_ALREADY_REGISTERED
  EMAIL_ALREADY_IN_USE
  SNS_VERIFICATION_FAILED
  INVALID_CREDENTIALS
  MEMBER_NOT_FOUND
  ACCOUNT_INACTIVE
  VERIFICATION_NOT_FOUND
  VERIFICATION_RATE_LIMITED
  RESEND_COOLDOWN_ACTIVE
  ALREADY_VERIFIED
  NOT_EMAIL_MEMBER
  SAME_AS_CURRENT_EMAIL
  INVALID_EMAIL_FORMAT
  INVALID_NICKNAME
  UNSUPPORTED_IMAGE_TYPE
  IMAGE_TOO_LARGE
  OBJECT_KEY_NOT_FOUND
  PHOTO_NOT_UPLOADED
  TERMS_NOT_FOUND
  TERMS_CODE_NOT_REQUIRED
  ROLE_NOT_FOUND
  SELF_DEMOTION
}

input VerifyEmailInput {
  verificationId: String!
  code: String!
}

type VerifyEmailPayload {
  success: Boolean!
  userErrors: [UserError!]!
  verified: Boolean
  failureReason: String
}

