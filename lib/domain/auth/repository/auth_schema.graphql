}

input RegisterSnsMemberInput {
  provider: Provider!
  idToken: String!
  email: String!
  ageVerified: Boolean!
  agreements: [AgreementInput!]!
  authorizationCode: String
  # provider가 준 닉네임(2026-08-25). 카카오는 `id_token` 클레임이 아니라 별도
  # 프로필 API에 있어 클라이언트가 넘기지 않으면 서버가 알 수 없다.
  #
  # **형식을 검증하지 않는다**(서버 안내) — 1자든 21자든 그대로 보내면 서버가
  # 조용히 자동 생성 닉네임으로 대체한다. 오류가 나지 않으므로 클라이언트가
  # 미리 자르거나 막을 이유가 없다.
  nickname: String
}

type RegisterSnsMemberPayload {
  success: Boolean!
  userErrors: [UserError!]!
  emailVerified: Boolean
  verificationId: String
}

