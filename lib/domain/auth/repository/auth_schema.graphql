type RetargetEmailVerificationPayload {
  success: Boolean!
  # 실제로 오는 코드: ALREADY_VERIFIED(인증을 마친 회원), RESEND_COOLDOWN_ACTIVE
  # (재발송과 60초 타이머를 공유한다), EMAIL_ALREADY_IN_USE, INVALID_EMAIL_FORMAT.
  userErrors: [UserError!]!
  # 새 핸들. 이후 verifyEmail·resendVerification은 이 값을 쓴다.
  verificationId: String
  expiresAt: String
}

