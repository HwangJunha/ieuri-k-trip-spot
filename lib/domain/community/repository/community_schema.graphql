# SPEC-0010 커뮤니티 슬라이스가 쓰는 서버 스키마 조각(committed codegen 입력).
# `schema/schema.introspection.json` 스냅샷에서 손으로 추린 안정 빌드 입력이며,
# gitignore된 스냅샷을 codegen이 직접 읽지 않는다(CLAUDE.md §13).

# 커뮤니티가 쓰는 카테고리는 `SpotCategory`와 값이 같지만 **다른 타입이다** —
# 글의 카테고리는 커뮤니티가 소유하고 장소의 카테고리는 관광 도메인이 소유한다.
# 값이 같다고 한 타입으로 합치면 한쪽 도메인의 변경이 다른 쪽을 끌고 간다.
enum TargetCategory {
  TOURIST_SPOT
  CULTURAL_FACILITY
  FESTIVAL_EVENT
  TRAVEL_COURSE
  LEISURE_SPORTS
  LODGING
  SHOPPING
  RESTAURANT
  TRANSPORT
}

type PostAuthor {
  id: ID!
  nickname: String!
  profileImageUrl: String
}

# 글에 붙은 장소. **null일 수 있다** — 장소 없는 글이 허용된다(가이드 §5).
# 제목·썸네일은 `Accept-Language`를 따른다(가이드 §9).
type PostSpot {
  id: ID!
  title: String!
  thumbnailImageUrl: String!
  category: TargetCategory
}

type Comment {
  id: ID!
  body: String!
  author: PostAuthor!
  ownedByViewer: Boolean!
  hidden: Boolean!
  createdAt: String!
}

type CommentEdge {
  cursor: String!
  node: Comment!
}

type CommentConnection {
  edges: [CommentEdge!]!
  pageInfo: PageInfo!
}

type Post {
  id: ID!
  title: String!
  body: String!
  tags: [String!]!
  category: TargetCategory!
  spot: PostSpot
  author: PostAuthor!
  photoKeys: [String!]!
  likeCount: Int!
  commentCount: Int!
  likedByViewer: Boolean!
  ownedByViewer: Boolean!
  hidden: Boolean!
  edited: Boolean!
  createdAt: String!
  commentPreview: [Comment!]!
}

type PostEdge {
  cursor: String!
  node: Post!
}

type PostConnection {
  edges: [PostEdge!]!
  pageInfo: PageInfo!
}

# `PageInfo`·`UserError`는 auth 스키마 조각이 이미 선언한다. codegen이 모든 조각을
# 한 네임스페이스에서 합치므로 여기서 다시 선언하면 중복이다.

# 상단 칩. **표시 문구는 서버가 주지 않는다** — enum 값과 순서만 온다(가이드 §2).
type CommunityChip {
  category: TargetCategory!
  position: Int!
}

type BlockedUserEdge {
  cursor: String!
  node: PostAuthor!
  blockedAt: String!
}

type BlockedUserConnection {
  edges: [BlockedUserEdge!]!
  pageInfo: PageInfo!
}

input CreatePostInput {
  category: TargetCategory!
  spotId: ID
  tags: [String!]!
  title: String!
  body: String!
  photoKeys: [String!]!
}

type CreatePostPayload {
  success: Boolean!
  userErrors: [UserError!]!
  postId: ID
}

# 제목·본문·사진만 바꾼다. 카테고리·장소·태그는 수정할 수 없다 — 바뀌면 글이 다른
# 피드로 순간이동하기 때문이다(가이드 §5).
input EditPostInput {
  postId: ID!
  title: String!
  body: String!
  photoKeys: [String!]
}

type EditPostPayload {
  success: Boolean!
  userErrors: [UserError!]!
}

input CreateCommentInput {
  postId: ID!
  body: String!
}

type CreateCommentPayload {
  success: Boolean!
  userErrors: [UserError!]!
  commentId: ID
}

input DeleteCommentInput {
  commentId: ID!
}

type DeleteCommentPayload {
  success: Boolean!
  userErrors: [UserError!]!
}

input DeletePostInput {
  postId: ID!
}

type DeletePostPayload {
  success: Boolean!
  userErrors: [UserError!]!
}

# 사진 업로드(가이드 §4). **서버는 이미지 바이트를 받지 않는다** — 앱이 스토리지로
# 직접 PUT하고, 그 PUT만 GraphQL이 아니다.
input PostImageUploadRequest {
  contentType: String!
  contentLength: Int!
}

input CreatePostImageUploadUrlsInput {
  images: [PostImageUploadRequest!]!
}

type PostImageUploadUrl {
  uploadUrl: String!
  objectKey: String!
  expiresAt: String!
}

type CreatePostImageUploadUrlsPayload {
  success: Boolean!
  userErrors: [UserError!]!
  uploadUrls: [PostImageUploadUrl!]!
}

input ConfirmPostImageUploadsInput {
  objectKeys: [String!]!
}

type PostImageUploadFailure {
  objectKey: String!
  code: String!
}

type ConfirmPostImageUploadsPayload {
  success: Boolean!
  userErrors: [UserError!]!
  confirmed: [String!]!
  failed: [PostImageUploadFailure!]!
}

input DeletePostImageInput {
  objectKey: String!
}

type DeletePostImagePayload {
  success: Boolean!
  userErrors: [UserError!]!
}

# 모더레이션(가이드 §6). 차단은 **양방향**이라 내가 차단한 사람과 나를 차단한
# 사람의 글이 모두 사라진다 — 서버가 걸러 주므로 앱이 필터링할 것은 없고, 차단
# 직후에는 피드를 다시 불러온다.
enum ReportReason {
  SPAM
  ABUSE
  INAPPROPRIATE_CONTENT
  OTHER
}

enum ReportTargetType {
  POST
  COMMENT
  MEMBER
}

input BlockUserInput {
  targetMemberId: ID!
}

type BlockUserPayload {
  success: Boolean!
  userErrors: [UserError!]!
}

input UnblockUserInput {
  targetMemberId: ID!
}

type UnblockUserPayload {
  success: Boolean!
  userErrors: [UserError!]!
}

# `detail`은 reason이 OTHER일 때 **필수**다. 스키마상 nullable이라 GraphQL이 막아
# 주지 않으므로 클라이언트 폼에서 미리 거른다(가이드 §6).
input ReportContentInput {
  targetType: ReportTargetType!
  targetId: ID!
  reason: ReportReason!
  detail: String
}

type ReportContentPayload {
  success: Boolean!
  userErrors: [UserError!]!
}

input LikePostInput {
  postId: ID!
}

type LikePostPayload {
  success: Boolean!
  userErrors: [UserError!]!
  likeCount: Int
}

input UnlikePostInput {
  postId: ID!
}

type UnlikePostPayload {
  success: Boolean!
  userErrors: [UserError!]!
  likeCount: Int
}

# Query·Mutation은 auth 조각이 선언한 것을 **확장**한다(spot 조각과 같은 규약) —
# 다시 선언하면 앞선 조각의 필드가 사라져 다른 기능의 codegen이 깨진다.
extend type Query {
  posts(
    spotId: ID
    latitude: Float
    longitude: Float
    radiusMeters: Int
    category: TargetCategory
    tag: String
    first: Int
    after: String
  ): PostConnection!
  comments(postId: ID!, first: Int, after: String): CommentConnection!
  post(id: ID!): Post
  blockedUsers(first: Int, after: String): BlockedUserConnection!
  communityChips: [CommunityChip!]!
}

extend type Mutation {
  createPost(input: CreatePostInput!): CreatePostPayload!
  editPost(input: EditPostInput!): EditPostPayload!
  deletePost(input: DeletePostInput!): DeletePostPayload!
  createComment(input: CreateCommentInput!): CreateCommentPayload!
  deleteComment(input: DeleteCommentInput!): DeleteCommentPayload!
  likePost(input: LikePostInput!): LikePostPayload!
  unlikePost(input: UnlikePostInput!): UnlikePostPayload!
  createPostImageUploadUrls(
    input: CreatePostImageUploadUrlsInput!
  ): CreatePostImageUploadUrlsPayload!
  confirmPostImageUploads(
    input: ConfirmPostImageUploadsInput!
  ): ConfirmPostImageUploadsPayload!
  deletePostImage(input: DeletePostImageInput!): DeletePostImagePayload!
  blockUser(input: BlockUserInput!): BlockUserPayload!
  unblockUser(input: UnblockUserInput!): UnblockUserPayload!
  reportContent(input: ReportContentInput!): ReportContentPayload!
}
