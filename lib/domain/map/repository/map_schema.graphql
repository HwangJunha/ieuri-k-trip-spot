# SPEC-0014 지도·혼잡도 쿼리가 쓰는 서버 스키마 조각(committed codegen 입력).
# `schema/schema.introspection.json` 스냅샷에서 손으로 추린 안정 빌드 입력이며,
# gitignore된 스냅샷을 codegen이 직접 읽지 않는다(CLAUDE.md §13).
#
# `SpotCategory`는 여기서 정의하지 않는다 — spot_schema.graphql이 소유하고 codegen이
# 조각을 하나로 병합하므로 중복 정의하면 충돌한다.

# 뷰포트 사각형. **경계선에 걸친 대상을 포함한다**(R1).
# minLat < maxLat, minLng < maxLng여야 하며 날짜변경선을 넘는 bbox는 지원하지 않는다.
input MapBoundsInput {
  minLat: Float!
  minLng: Float!
  maxLat: Float!
  maxLng: Float!
}

# 지도 마커용 spot. 목록 화면의 `Spot`과 **다른 타입이다** — 지도는 좌표와 이름만
# 있으면 되고, 거리·저작권 같은 목록 전용 필드를 실어 나를 이유가 없다.
type MapSpot {
  id: ID!
  title: String!
  thumbnailImageUrl: String!
  category: SpotCategory!
  # 업스트림 EVENT_X/Y와 달리 이름이 바로잡혀 있다(spec §7.7) — lng가 경도, lat이 위도다.
  lng: Float!
  lat: Float!
}

# **클러스터는 라이브 스키마에서 제거됐다**(2026-08-10 확인).
#
# 계약 초안에는 `SpotCluster`와 `MapViewportResult.clusters`가 있었으나 서버가
# 빼면서 타입 자체가 사라졌다. 없는 필드를 요청하면 `mapViewport`가 통째로 실패해
# 마커가 하나도 오지 않는다 — 실기기에서 그 상태였다.
#
# 저줌 대응은 클라이언트의 격자 솎아내기가 맡는다(`marker_thinning.dart`).

# 문화행사 마커(R12). 썸네일·유료여부는 계약에서 제외됐다(spec §7.9).
type CulturalEvent {
  id: String!
  title: String!
  place: String!
  # "2026-08-07~2026-08-10" 형태의 단일 문자열이다(spec §4.6).
  period: String!
  lng: Float!
  lat: Float!
  url: String
}

type MapViewportResult {
  spots: [MapSpot!]!
  events: [CulturalEvent!]!
  # 결과가 줌별 상한을 넘어 일부만 왔다는 뜻(R3). 상한 값 자체는 노출되지 않는다.
  truncated: Boolean!
}

enum CongestionLevel {
  RELAXED
  NORMAL
  SLIGHTLY_CROWDED
  CROWDED
}

enum CommercialActivityLevel {
  QUIET
  NORMAL
  BUSY
  PEAK
}

type CongestionSnapshot {
  level: CongestionLevel!
  populationMin: Int!
  populationMax: Int!
  # 업스트림 PPLTN_TIME(ISO-8601). **약 30분 지연되어 도착한다**(spec §4.2) —
  # "지금"으로 표기하지 않는다(R27).
  observedAt: String!
}

type CongestionForecast {
  forecastTime: String!
  level: CongestionLevel!
  populationMin: Int!
  populationMax: Int!
}

type CommercialStatus {
  level: CommercialActivityLevel!
  # 참이면 실측 기준선이 없어 업스트림이 NORMAL로 고정 반환한 값이다(R28).
  isDefaulted: Boolean!
  # 인구 블록과 **다른 주기로** 갱신된다(spec §4.3) — 그래서 별도로 노출된다.
  observedAt: String!
}

# 폴리곤 좌표를 담지 않는다 — seoulCongestionAreas와 id로 조인한다(spec §7.3).
type CongestionArea {
  id: String!
  # 활성 언어로 표기한 구역명(R31). Accept-Language 헤더 기반이며 인자로 받지 않는다.
  name: String!
  congestion: CongestionSnapshot!
  # FCST_YN이 N이면 부재다. **부재는 조회 실패가 아니다**(R9).
  forecast: [CongestionForecast!]
  # 121곳 중 82곳에만 값이 있다. 부재와 isDefaulted를 구분해야 한다(R10·R28).
  commercial: CommercialStatus
}

type SeoulCongestionResult {
  areas: [CongestionArea!]!
  # 업스트림 장애를 **오류가 아니라 데이터로** 표현한다(R11, spec §7.6) — 오류로
  # 던지면 지도 전체가 실패한 것처럼 다뤄지는데 실제로는 한 레이어만 없는 상태다.
  degraded: Boolean!
  # degraded일 때 마지막으로 성공한 시점(있으면).
  staleSince: String
}

# 정적 폴리곤 경계(R17). 앱 시작 시 1회 조회해 캐시하는 것을 전제한다(R26).
type CongestionAreaBoundary {
  id: String!
  name: String!
  category: String!
  # GeoJSON과 같은 순서 규약으로 [lng, lat] 쌍이며, 첫 점과 끝 점이 같아 닫혀 있다.
  polygon: [[Float!]!]!
}

extend type Query {
  mapViewport(
    bbox: MapBoundsInput!
    # 카카오맵 줌 레벨(1~14, 클수록 확대).
    zoom: Int!
    # SPEC-0020 R7: 지도 카테고리 필터. code 문자열 배열이며 OR로 걸린다.
    categories: [String!]
    # true면 요청 언어로 쓰인 원문만, false면 번역본만, 생략하면 둘 다(SPEC-0019).
  ): MapViewportResult!

  # SPEC-0036 지도 영역 기준 추천. **인증 필수**(UNAUTHENTICATED).
  #
  # `mapViewport`와 나눠 둔 이유: 그쪽은 인증 없이 도는 계약이고 `events`·`truncated`가
  # 거기 묶여 있어, 추천을 넣으면 로그인 없이 못 쓰게 되어 계약이 깨진다.
  #
  # **사각형으로 후보를 조달하고 거리 요인만 bbox 중심점 기준으로 계산한다**(서버 결정
  # 2026-09-18, 미결 T3 해소). 원으로 근사하지 않는다 — 내접원은 네 모서리가 빠져
  # 화면에 보이는 장소가 추천 대상에서 빠지고(FR-002 위반), 외접원 + 사후 필터는 실효
  # 후보 수가 뷰포트 종횡비에 따라 달라진다. 점수 계수는 SPEC-0035를 그대로 승계한다.
  #
  # 정렬은 추천 점수 내림차순, 동점은 id 오름차순. 같은 영역·같은 excludedIds·같은
  # 반응 상태면 **항상 같은 순서**다(QR-001) — 클라이언트가 섞지 않는다.
  #
  # **`first`보다 적게 오면 영역 안 후보가 소진된 것이다.** 빈 결과는 오류가 아니다
  # (AC-012). 한 번에 점수를 계산하는 후보 상한은 2,000건이다(서버 결정, 미결 T5).
  #
  # 오류: UNAUTHENTICATED(2026-09-18 라이브 관측) · INVALID_BBOX ·
  # BBOX_TOO_LARGE(면적 4.0 제곱도, SPEC-0014 승계) · EMPTY_CATEGORY_SET.
  #
  # **뒤의 셋은 관측하지 못했다** — 인증이 bbox·카테고리 검증보다 먼저 걸려,
  # 토큰 없이는 어떤 입력을 넣어도 UNAUTHENTICATED가 먼저 온다. 서버 결정
  # (`ieuri-server#136`)에 적힌 값을 옮긴 것이다.
  mapRecommendedSpots(
    bbox: MapBoundsInput!
    # 이미 표시한 장소. 생략하거나 빈 배열이면 제외 없음이며 **개수 상한이 없다**.
    # 세션을 들고 있는 쪽은 클라이언트다 — 「봤다」의 판정이 마커로 실제 그려졌는가라,
    # 격자로 솎아 그리는 클라이언트만 안다(서버 결정 2026-09-18).
    # 숫자로 읽히지 않는 항목은 서버가 조용히 무시한다.
    excludedIds: [ID!]
    # mapViewport와 같은 규약. code 문자열 배열이며 OR로 걸린다.
    categories: [String!]
    # 상한 100, 초과는 절삭(오류가 아니다).
    first: Int = 10
  ): [MapSpot!]!

  # areaIds 또는 bbox 중 하나는 필수다(R6). 둘 다 주면 areaIds가 우선한다.
  seoulCongestion(
    areaIds: [String!]
    bbox: MapBoundsInput
  ): SeoulCongestionResult!

  seoulCongestionAreas: [CongestionAreaBoundary!]!

  # 추천 시군구 목록(SPEC-0015). 배열 순서가 곧 추천 순위다.
  #
  # **origin이 필수다.** 이 쿼리는 "지금 있는 곳 말고 근처의 다른 곳"을 답한다 —
  # origin이 속한 시도 안에서만 고르고 origin의 시군구 자신은 결과에서 빠지므로,
  # 좌표가 없으면 질문 자체가 성립하지 않는다. 계약 초안은 선택이었으나 서버가
  # 필수로 확정했다(2026-08-11 introspection).
  #
  # 빈 목록은 오류가 아니다 — 바다·해외 좌표, 시군구 3개 미만인 시도(세종·제주),
  # 관광지가 충분치 않아 후보에서 빠진 지역만 남은 시도가 그렇다.
  recommendedRegions(
    origin: CoordinatesInput!
    # 생략 시 10. 상한 50을 넘으면 잘리고, 0 이하는 INVALID_LIMIT으로 거절된다.
    limit: Int
  ): RecommendedRegionResult!
}

input CoordinatesInput {
  lat: Float!
  lng: Float!
}

type Coordinates {
  lat: Float!
  lng: Float!
}

# **추천 순위는 배열 순서다** — regions[0]이 1위다. totalScore는 계약에서 삭제됐다.
type RecommendedRegionResult {
  regions: [RecommendedRegion!]!
}

type RecommendedRegion {
  # 시군구 행정표준코드 5자리(예: 11110).
  code: String!
  name: String!
  # 같은 이름의 시군구를 구분하는 데 쓴다(중구·남구·동구).
  provinceName: String!
  # 산출할 수 없는 항목은 이 목록에서 빠진다 — 0점으로 채우지 않는다.
  scores: [RegionScore!]!
  # 산출에 쓰인 항목 수(= scores의 길이). 작을수록 근거가 얕다.
  scoreFactorCount: Int!
  # **관광지가 실제로 모여 있는 지점**이며 지역의 기하학적 중심이 아니다.
  center: Coordinates!
}

type RegionScore {
  factor: RegionScoreFactor!
  # 0~100. 높을수록 추천에 유리하다.
  #
  # **절대 점수가 아니라 후보 집합 안의 상대 위치다.** 막대 길이로는 쓰되 숫자로
  # 노출하지 않는다 — "48점"처럼 보이면 절대 평가로 읽힌다.
  value: Float!
  # 이 항목의 순위. **1이 가장 좋다.**
  #
  # CONGESTION은 값이 이미 뒤집혀 있어 1위가 가장 덜 붐비는 곳이다.
  #
  # **반환된 목록이 아니라 시도 전체 후보 기준이다** — limit=10으로 받아도 rank가
  # 15일 수 있다. 동점은 표준 경쟁 순위(1, 2, 2, 4)이며, 항목마다 모수가 다르다
  # (그 항목을 산출할 수 있는 지역만 센다).
  rank: Int!
  # **삭제 예정 필드다 — 쓰지 않는다.**
  basisAt: String
}

enum RegionScoreFactor {
  CONGESTION
  VISITOR_VOLUME
  STAY_INTENSITY
  SPENDING_INTENSITY
  DISTANCE
}
