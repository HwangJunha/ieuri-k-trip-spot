# SPEC-0011 이메일 변경(R7·R8)이 쓰는 서버 스키마 조각 (committed codegen 입력).
# `schema/schema.introspection.json` 스냅샷(2026-08-09 갱신)에서 손으로 추린 안정
# 빌드 입력이며, gitignore된 스냅샷을 codegen이 직접 읽지 않는다(CLAUDE.md §13).
#
# **프로필 조각과 파일을 나눈 이유.** 이메일 변경은 3개 뮤테이션과 2단계 상태 기계를
# 갖는 독립 흐름이고, 프로필 수정(닉네임·이미지)과 같이 저장·같이 실패하지 않는다.
# 한 파일에 섞으면 프로필 조각을 읽는 사람이 어디까지가 저장 폼인지 알기 어렵다.
#
# `UserError`는 auth 조각이 이미 선언했다 — codegen이 모든 조각을 한 이름공간에
# 합치므로 여기서 다시 선언하면 중복 정의로 빌드가 깨진다.

input ChangeEmailInput {
  newEmail: String!
}

# 1단계. 성공해도 **프로필 이메일은 아직 바뀌지 않는다**(R7 첫 기준) — 새 주소로
# 코드를 보냈을 뿐이고, 돌려주는 `verificationId`가 2단계·재발송의 손잡이다.
type ChangeEmailPayload {
  success: Boolean!
  userErrors: [UserError!]!
  verificationId: String
  expiresAt: String
}

input ConfirmEmailChangeInput {
  verificationId: String!
  code: String!
}

# 2단계. `failureReason`은 **enum이 아니라 String**이다 — 라이브 스키마 확인 결과이며,
# 모르는 값이 올 수 있으므로 클라이언트가 미지 값을 일반 실패로 흡수한다.
# 알려진 값: CODE_MISMATCH · EXPIRED · MAX_ATTEMPTS_EXCEEDED (디자인 §4).
type ConfirmEmailChangePayload {
  success: Boolean!
  userErrors: [UserError!]!
  email: String
  failureReason: String
}

input ResendEmailChangeInput {
  verificationId: String!
}

# 재발송. 서버 쿨다운은 `userErrors`로 오지만 클라이언트가 60초를 **미리 막는다**
# (디자인 §4) — 눌러 본 뒤 거절당하는 것보다 남은 시간을 보여주는 편이 낫다.
type ResendEmailChangePayload {
  success: Boolean!
  userErrors: [UserError!]!
  verificationId: String
  expiresAt: String
}

# Mutation은 auth 조각이 선언한 것을 **확장**한다(다른 조각과 같은 규약).
extend type Mutation {
  changeEmail(input: ChangeEmailInput!): ChangeEmailPayload!
  confirmEmailChange(
    input: ConfirmEmailChangeInput!
  ): ConfirmEmailChangePayload!
  resendEmailChange(input: ResendEmailChangeInput!): ResendEmailChangePayload!
}
