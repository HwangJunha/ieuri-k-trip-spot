# SPEC-0002 Discover 스와이프 피드 오퍼레이션. 생성 타입은 repository 안에서만
# 쓰이고 도메인 모델로 매핑된다(CLAUDE.md §3, POL-020).

# SPEC-0035 내 주변 추천 묶음. 홈 「Near you」와 Discover 스와이프가 함께 쓴다 — Discover의
# 소스는 이것 하나다(옛 오프셋 `query Spots`는 사용자 결정 2026-09-12로 뺐다. 서버의
# `Query.spots`는 불변이며 커뮤니티 장소 시트가 계속 쓴다). 언어는 Accept-Language
# 헤더로 전달된다.
#
# **페이지가 아니라 묶음이다.** 서버가 이미 반응한 장소를 뺀 뒤 점수순 앞 first건을
# 주므로 page/after 인자가 없다. 큐 보충은 같은 인자로 다시 부르고 큐와 겹치는 id를
# 클라이언트가 걷어낸다.
query RecommendedSpots(
  $latitude: Float!
  $longitude: Float!
  $radiusMeters: Int
  $categories: [String!]
  $first: Int
) {
  recommendedSpots(
    latitude: $latitude
    longitude: $longitude
    radiusMeters: $radiusMeters
    categories: $categories
    first: $first
  ) {
    id
    title
    address
    thumbnailImageUrl
    distanceMeters
    category {
      code
      label
      iconUrl
    }
    copyright
    attributionText
  }
}

# 활성 언어에서 서버가 노출하는 카테고리(spec §5). 언어는 헤더로 전달된다.
query AvailableSpotCategories {
  availableSpotCategories {
    code
    label
    iconUrl
  }
}

# SPEC-0003 상세 단건 조회. 언어는 Accept-Language 헤더로 전달(인자 없음, spec §2).
# 생성 타입은 repository 안에서만 쓰이고 도메인 모델(SpotDetail/SpotImage)로 매핑된다
# (POL-020, AC-32).
#
# **카테고리 인자는 사라지지 않았다.** SPEC-0020이 "서버가 spot 자신의 카테고리로
# 해석한다"고 보고 인자를 걷어냈으나 서버는 계속 요구하고 있었고, 이름과 타입만
# `category: SpotCategory!` → `categoryCode: String!`으로 바뀌었다. 커밋된 SDL에도
# 인자 없이 적혀 있어 codegen이 통과하는 바람에 상세 화면 전체가 검증 오류로 막혀
# 있었다(MissingFieldArgument).
#
# **spotDetail.category.code는 쓸 수 없다** — 서버가 전 spot에서 null을 돌려준다.
# 그래서 호출부(스와이프·검색·좋아요)가 목록에서 받은 코드를 라우트로 실어 보낸다.
query SpotDetail($id: ID!, $categoryCode: String!) {
  spotDetail(id: $id) {
    id
    title
    # **category를 요청하지 않는다.** 서버가 이 필드를 채우지 못해
    # (`SpotCategory.code`가 null, 내부적으로는 String을 객체로 캐스팅하다 터진다)
    # non-null 위반이 부모로 전파돼 spotDetail 전체가 null이 된다 — 상세 화면이
    # 통째로 죽는 원인이었다.
    #
    # 상세 화면은 카테고리를 그리지 않고, 운영정보 조회에 필요한 코드는 목록이
    # 넘겨준 값(`spotCategoryCodes`)을 쓰므로 응답에서 받을 이유가 없다.
    thumbnailImageUrl
    overview
    address
    homepage
    tel
    copyright
    attributionText
    # SPEC-0027 미니 지도용 좌표. mapX가 경도, mapY가 위도다 — 이름이 직관과 반대라
    # 매핑에서 뒤집지 않도록 주의한다.
    mapX
    mapY
    gallery {
      imageUrl
      thumbnailUrl
      caption
      copyright
      attributionText
    }
    likeCount
    # SPEC-0026 R3·R4. 호출자가 이 장소에 남긴 최신 반응이며 **비인증이면 null이다.**
    # 질문/답변 진입점을 LIKE일 때만 노출하는 데 쓴다 — null과 DISLIKE는 둘 다 자격
    # 없음이다. 표시용이지 서버 판정을 대체하지 않는다(서버가 커맨드 시점에 다시 본다).
    viewerReaction
    # 운영 정보. 카테고리마다 서버가 공통 이름으로 정규화해 주고, 해당 개념이 없는
    # 카테고리에선 필드가 null이다 — 값 있는 행만 렌더한다.
    intro(categoryCode: $categoryCode) {
      businessHours
      closedDays
      parking
      inquiryPhone
      fee
      petAllowed
      creditCardAccepted
    }
    # 이용안내 항목명/내용 쌍. 비어 있을 수 있다.
    #
    # **코드가 틀리면 오류가 아니라 빈 값이다** — 서버가 intro는 null, infoItems는
    # 빈 배열로 준다. 카테고리를 모르고 열어도 상세 본문은 살아 있고 운영정보 섹션만
    # 비므로, 알 수 없을 때 조회를 막지 않는다.
    infoItems(categoryCode: $categoryCode) {
      name
      text
    }
  }
}

# SPEC-0008 R-18 좋아요 목록(커서 페이징). 생성 타입(LikedSpot·LikedSpotConnection·
# LikedSpotEdge)은 repository 밖으로 누출하지 않고 도메인 모델로 매핑한다(POL-020).
#
# likedAt은 엣지에 있지만 조회하지 않는다 — 화면이 좋아요 시각을 표시하지 않고(요구사항에
# 표시 요건 없음), 정렬은 서버가 보장하므로 클라이언트가 재정렬하지 않는다(§5.2).
query LikedSpots($categories: [String!], $first: Int, $after: String) {
  likedSpots(categories: $categories, first: $first, after: $after) {
    ...LikedSpotPage
  }
}

# SPEC-0033 목록 내 검색. **`likedSpots`에 인자가 붙은 것이 아니라 별개의 쿼리다** —
# 서버가 그렇게 냈다(라이브 스키마 확인, 2026-08-29). `query`는 **non-null 필수**라
# "생략 = 필터 없음"이라는 표현 자체가 없다. 그래서 repository가 검색어 유무로 두
# 오퍼레이션을 가르고, 빈 검색어는 아예 이 쿼리를 부르지 않는다.
#
# 반환 타입이 `likedSpots`와 같은 LikedSpotConnection!이라 매핑 경로를 공유한다
# (아래 프래그먼트). 정렬도 likedAt DESC 그대로다.
query SearchLikedSpots(
  $query: String!
  $categories: [String!]
  $first: Int
  $after: String
) {
  searchLikedSpots(
    query: $query
    categories: $categories
    first: $first
    after: $after
  ) {
    ...LikedSpotPage
  }
}

# 두 좋아요 목록 쿼리가 공유하는 선택 집합 — 한쪽만 고쳐 서로 어긋나는 것을 막는다.
fragment LikedSpotPage on LikedSpotConnection {
  edges {
    cursor
    node {
      id
      title
      thumbnailImageUrl
      address
      category {
        code
        label
        iconUrl
      }
      copyright
      attributionText
    }
  }
  pageInfo {
    hasNextPage
    endCursor
  }
}

# 스와이프 반응 기록(낙관적). userErrors를 실패로 번역한다(spec §2).
mutation ReactToSpot($input: ReactToSpotInput!) {
  reactToSpot(input: $input) {
    success
    userErrors {
      code
      message
      field
    }
  }
}

# ── SPEC-0013 검색 · 자동완성 · Popular ────────────────────────────────────

# R1–R8. 반경 내 spot 검색. 언어는 Accept-Language 헤더로 전달된다(다른 조회와 동일).
#
# **오프셋 페이징이다**(page/size) — 초안은 커서였으나 서버가 커서 방식에서 정확히
# 동작하지 않아 전환됐다. 기존 `spots`와 같은 모양이며 `SpotSearchEdge`는 사라졌다.
#
# 정렬은 서버가 보장하므로 클라이언트가 재정렬하지 않는다(POL-019).
#
# userErrors는 입력 검증 실패(EMPTY_QUERY·QUERY_TOO_LONG·RADIUS_TOO_LARGE)를 데이터로
# 돌려주는 경로다(POL-015 — HTTP는 항상 200). 결과 0건은 오류가 아니다.
query SearchSpots(
  $query: String!
  $latitude: Float!
  $longitude: Float!
  $radiusMeters: Int
  $categories: [String!]
  $page: Int
  $size: Int
) {
  searchSpots(
    query: $query
    latitude: $latitude
    longitude: $longitude
    radiusMeters: $radiusMeters
    categories: $categories
    page: $page
    size: $size
  ) {
    success
    userErrors {
      code
      field
    }
    connection {
      items {
        id
        title
        address
        thumbnailImageUrl
        distanceMeters
        category {
          code
          label
          iconUrl
        }
        copyright
        attributionText
        # 지도(SPEC-0014)가 검색 결과로 지도를 옮기는 데 쓴다. mapX가 경도,
        # mapY가 위도다 — 이름이 직관과 반대라 매핑에서 뒤집지 않도록 주의한다.
        mapX
        mapY
      }
      page
      hasNext
      totalCount
    }
  }
}

# R9. 제목 접두 자동완성. 페이지네이션하지 않으며 빈 질의는 빈 목록이다.
query SpotSearchSuggestions(
  $query: String!
  $latitude: Float!
  $longitude: Float!
  $radiusMeters: Int
  $limit: Int
) {
  spotSearchSuggestions(
    query: $query
    latitude: $latitude
    longitude: $longitude
    radiusMeters: $radiusMeters
    limit: $limit
  ) {
    id
    title
    category {
      code
      label
      iconUrl
    }
  }
}

# R18. 좋아요 총합 내림차순. likeCount는 랭킹 근거라 edge에 실린다.
#
# **totalCount가 없다** — 라이브 스키마의 PopularSpotConnection에는 그 필드가 없다
# (제안에는 있었으나 서버가 다르다). 홈 섹션은 건수를 표시하지 않으므로 문제없다.
query PopularSpots(
  $latitude: Float!
  $longitude: Float!
  $radiusMeters: Int
  $categories: [String!]
  $first: Int
  $after: String
) {
  popularSpots(
    latitude: $latitude
    longitude: $longitude
    radiusMeters: $radiusMeters
    categories: $categories
    first: $first
    after: $after
  ) {
    edges {
      node {
        id
        title
        address
        thumbnailImageUrl
        distanceMeters
        category {
          code
          label
          iconUrl
        }
        copyright
        attributionText
      }
      cursor
      likeCount
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
