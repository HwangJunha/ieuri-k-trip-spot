# SPEC-0002 Discover 스와이프 피드 오퍼레이션. 생성 타입은 repository 안에서만
# 쓰이고 도메인 모델로 매핑된다(CLAUDE.md §3, POL-020).

# 위치 기반 스팟 한 페이지(오프셋). 언어는 인자로 보내지 않고 Accept-Language
# 헤더로 전달된다(spec §2).
query Spots(
  $latitude: Float!
  $longitude: Float!
  $radiusMeters: Int
  $categories: [String!]
  $hasOrigin: Boolean
  $page: Int
  $size: Int
) {
  spots(
    latitude: $latitude
    longitude: $longitude
    radiusMeters: $radiusMeters
    categories: $categories
    hasOrigin: $hasOrigin
    page: $page
    size: $size
  ) {
    items {
      id
      title
      address
      thumbnailImageUrl
      distanceMeters
      category {
        code
        label
        iconUrl
      }
      copyright
      attributionText
    }
    page
    hasNext
    totalCount
  }
}

# 활성 언어에서 서버가 노출하는 카테고리(spec §5). 언어는 헤더로 전달된다.
query AvailableSpotCategories {
  availableSpotCategories {
    code
    label
    iconUrl
  }
}

# SPEC-0003 상세 단건 조회. 언어는 Accept-Language 헤더로 전달(인자 없음, spec §2).
# 생성 타입은 repository 안에서만 쓰이고 도메인 모델(SpotDetail/SpotImage)로 매핑된다
# (POL-020, AC-32).
#
# SPEC-0020: $category 인자가 사라졌다. 예전에는 intro/infoItems가 카테고리를
# 요구해 호출부가 넘겼으나, 이제 서버가 spot 자신의 카테고리로 해석한다 —
# 상세를 열 때 카테고리를 알 필요가 없어졌다(라우팅에서도 제거됨).
query SpotDetail($id: ID!) {
  spotDetail(id: $id) {
    id
    title
    category {
      code
      label
      iconUrl
    }
    thumbnailImageUrl
    overview
    address
    homepage
    tel
    copyright
    attributionText
    gallery {
      imageUrl
      thumbnailUrl
      caption
      copyright
      attributionText
    }
    likeCount
    # 운영 정보. 카테고리마다 서버가 공통 이름으로 정규화해 주고, 해당 개념이 없는
    # 카테고리에선 필드가 null이다 — 값 있는 행만 렌더한다.
    intro {
      businessHours
      closedDays
      parking
      inquiryPhone
      fee
      petAllowed
      creditCardAccepted
    }
    # 이용안내 항목명/내용 쌍. 비어 있을 수 있다.
    infoItems {
      name
      text
    }
  }
}

# SPEC-0008 R-18 좋아요 목록(커서 페이징). 생성 타입(LikedSpot·LikedSpotConnection·
# LikedSpotEdge)은 repository 밖으로 누출하지 않고 도메인 모델로 매핑한다(POL-020).
#
# likedAt은 엣지에 있지만 조회하지 않는다 — 화면이 좋아요 시각을 표시하지 않고(요구사항에
# 표시 요건 없음), 정렬은 서버가 보장하므로 클라이언트가 재정렬하지 않는다(§5.2).
query LikedSpots($categories: [String!], $first: Int, $after: String) {
  likedSpots(categories: $categories, first: $first, after: $after) {
    edges {
      cursor
      node {
        id
        title
        thumbnailImageUrl
        address
        category {
          code
          label
          iconUrl
        }
        copyright
        attributionText
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# 스와이프 반응 기록(낙관적). userErrors를 실패로 번역한다(spec §2).
mutation ReactToSpot($input: ReactToSpotInput!) {
  reactToSpot(input: $input) {
    success
    userErrors {
      code
      message
      field
    }
  }
}

# ── SPEC-0013 검색 · 자동완성 · Popular ────────────────────────────────────

# R1–R8. 반경 내 spot 검색. 언어는 Accept-Language 헤더로 전달된다(다른 조회와 동일).
#
# **오프셋 페이징이다**(page/size) — 초안은 커서였으나 서버가 커서 방식에서 정확히
# 동작하지 않아 전환됐다. 기존 `spots`와 같은 모양이며 `SpotSearchEdge`는 사라졌다.
#
# 정렬은 서버가 보장하므로 클라이언트가 재정렬하지 않는다(POL-019).
#
# userErrors는 입력 검증 실패(EMPTY_QUERY·QUERY_TOO_LONG·RADIUS_TOO_LARGE)를 데이터로
# 돌려주는 경로다(POL-015 — HTTP는 항상 200). 결과 0건은 오류가 아니다.
query SearchSpots(
  $query: String!
  $latitude: Float!
  $longitude: Float!
  $radiusMeters: Int
  $categories: [String!]
  $page: Int
  $size: Int
) {
  searchSpots(
    query: $query
    latitude: $latitude
    longitude: $longitude
    radiusMeters: $radiusMeters
    categories: $categories
    page: $page
    size: $size
  ) {
    success
    userErrors {
      code
      field
    }
    connection {
      items {
        id
        title
        address
        thumbnailImageUrl
        distanceMeters
        category {
          code
          label
          iconUrl
        }
        copyright
        attributionText
        # 지도(SPEC-0014)가 검색 결과로 지도를 옮기는 데 쓴다. mapX가 경도,
        # mapY가 위도다 — 이름이 직관과 반대라 매핑에서 뒤집지 않도록 주의한다.
        mapX
        mapY
      }
      page
      hasNext
      totalCount
    }
  }
}

# R9. 제목 접두 자동완성. 페이지네이션하지 않으며 빈 질의는 빈 목록이다.
query SpotSearchSuggestions(
  $query: String!
  $latitude: Float!
  $longitude: Float!
  $radiusMeters: Int
  $limit: Int
) {
  spotSearchSuggestions(
    query: $query
    latitude: $latitude
    longitude: $longitude
    radiusMeters: $radiusMeters
    limit: $limit
  ) {
    id
    title
    category {
      code
      label
      iconUrl
    }
  }
}

# R18. 좋아요 총합 내림차순. likeCount는 랭킹 근거라 edge에 실린다.
#
# **totalCount가 없다** — 라이브 스키마의 PopularSpotConnection에는 그 필드가 없다
# (제안에는 있었으나 서버가 다르다). 홈 섹션은 건수를 표시하지 않으므로 문제없다.
query PopularSpots(
  $latitude: Float!
  $longitude: Float!
  $radiusMeters: Int
  $categories: [String!]
  $hasOrigin: Boolean
  $first: Int
  $after: String
) {
  popularSpots(
    latitude: $latitude
    longitude: $longitude
    radiusMeters: $radiusMeters
    categories: $categories
    hasOrigin: $hasOrigin
    first: $first
    after: $after
  ) {
    edges {
      node {
        id
        title
        address
        thumbnailImageUrl
        distanceMeters
        category {
          code
          label
          iconUrl
        }
        copyright
        attributionText
      }
      cursor
      likeCount
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
