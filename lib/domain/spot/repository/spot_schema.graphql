# SPEC-0002 spots 슬라이스가 쓰는 서버 스키마 조각(committed codegen 입력).
# `schema/schema.introspection.json` 스냅샷에서 손으로 추린 안정 빌드 입력이며,
# gitignore된 스냅샷을 codegen이 직접 읽지 않는다(CLAUDE.md §13).

# SPEC-0020 R11: enum에서 객체로 바뀌었다. 서버가 앱 업데이트 없이 카테고리를
# 추가할 수 있어야 하므로 값 집합을 클라이언트가 고정하지 않는다(AC1.3).
#
# `code`가 안정 식별자이며 비교·필터·전송은 전부 이 값으로 한다. `label`은 서버가
# 활성 언어로 준 표시 문구라 클라이언트가 번역하지 않는다(l10n 매핑 제거).
# `iconUrl`은 현재 전 카테고리 null이라 Material 아이콘 폴백이 실제 경로다.
type SpotCategory {
  code: String!
  label: String!
  iconUrl: String
}

enum CopyrightType {
  TYPE1
  TYPE3
  UNSPECIFIED
}

enum SpotReaction {
  LIKE
  DISLIKE
}

type Spot {
  id: ID!
  title: String!
  address: String
  thumbnailImageUrl: String!
  distanceMeters: Float!
  category: SpotCategory!
  copyright: CopyrightType!
  attributionText: String!
  mapX: Float!
  mapY: Float!
}

type SpotPage {
  items: [Spot!]!
  page: Int!
  hasNext: Boolean!
  totalCount: Int
}

# SPEC-0003 상세 전용 read shape. 라이브 스키마 스냅샷에서 옮긴 committed codegen
# 입력이다(서버가 spotDetail을 서빙하기 시작한 뒤 제안 기준에서 실물 기준으로 갱신).

# 갤러리 이미지 한 장. TourAPI detailImage2가 이미지별 cpyrhtDivCd를 주므로
# 저작권/문구는 이미지별이며 부모 Spot에서 상속하지 않는다.
type SpotImage {
  imageUrl: String!
  thumbnailUrl: String
  caption: String
  copyright: CopyrightType!
  attributionText: String!
}

# 관광지 운영 정보(detailIntro2). TourAPI는 카테고리마다 응답 필드가 완전히 다르므로
# (관광지 usetime, 음식점 opentimefood …) 서버가 의미가 같은 필드를 공통 이름으로
# 정규화해 내려준다. 카테고리에 그 개념이 없으면 null이다(예: 여행코스엔 주차·휴무 없음).
type SpotIntro {
  businessHours: String
  closedDays: String
  parking: String
  inquiryPhone: String
  fee: String
  petAllowed: String
  creditCardAccepted: String
}

# 이용안내 1건(detailInfo2). 카테고리별 반복 항목을 항목명/내용 쌍으로 정규화한다.
type SpotInfoItem {
  name: String!
  text: String!
}

# 상세 전용 반환 타입. Spot의 확장이 아니라 별도 shape다(어떤 인터페이스도 구현 안 함).
type SpotDetail {
  id: ID!
  title: String!
  category: SpotCategory!
  thumbnailImageUrl: String!
  overview: String
  address: String
  homepage: String
  tel: String
  copyright: CopyrightType!
  attributionText: String!
  # SPEC-0027: 미니 지도가 쓰는 좌표. mapX가 경도, mapY가 위도다 — 이름이 직관과
  # 반대라 매핑에서 뒤집지 않도록 주의한다. 둘 다 non-null이라 상세 응답에는 좌표가
  # 항상 있고, 그래서 지도 섹션은 좌표 부재를 다루지 않는다.
  mapX: Float!
  mapY: Float!
  # SPEC-0008 R-7·R-9: 갤러리 조회가 실패하면 서버가 필드를 null로 내리고 부분 실패를
  # errors[]에 담는다(전체 실패가 아니다). null(조회 실패)과 빈 배열(정상적으로 없음)은
  # 화면 결과가 같으므로 repository가 하나로 접는다(AC-28) — 도메인 모델은 구분하지 않는다.
  gallery: [SpotImage!]
  likeCount: Int!
  # SPEC-0026 R3/R4: 호출자가 이 장소에 남긴 최신 반응. 반응한 적 없거나 비인증이면 null.
  # `reactToSpot`은 덮어쓰기만 되고 취소가 없으므로 항상 가장 최근 판정이다.
  #
  # 질문/답변 작성 진입점을 LIKE일 때만 노출하는 데 쓴다. null과 DISLIKE는 **둘 다**
  # 자격 없음이다. 표시용이지 서버 판정을 대체하지 않는다 — 서버가 뮤테이션 시점에
  # 다시 판정하며 클라이언트는 NOT_ELIGIBLE_TO_ASK/ANSWER를 반드시 처리한다(R5).
  viewerReaction: SpotReaction
  # 카테고리별로 다른 TourAPI 응답을 정규화하려면 **서버가 카테고리를 알아야 한다.**
  # SPEC-0020이 이 인자가 사라진 것으로 보고 걷어냈으나 실제로는 이름과 타입만
  # 바뀌었다(`category: SpotCategory!` → `categoryCode: String!`). 여기 인자를 빠뜨리면
  # codegen은 통과하고 런타임에 MissingFieldArgument로 상세가 통째로 막힌다.
  #
  # 값은 `SpotCategory.code`(`TOURIST_SPOT` 등)를 그대로 쓴다. **빈 문자열은 서버가
  # 예외로 거부하고, 틀린 코드는 조용히 빈 값을 준다.**
  intro(categoryCode: String!): SpotIntro
  # gallery와 같은 규칙(SPEC-0008 R-8): 조회 실패면 null, 정상적으로 없으면 빈 배열.
  # 둘 다 이용안내 섹션을 숨기고 오류 문구를 띄우지 않는다(AC-29).
  infoItems(categoryCode: String!): [SpotInfoItem!]
}

# SPEC-0008 R-18 좋아요 목록. 커서 페이징이며, 상세(SpotDetail)가 아니라 목록 카드가
# 필요한 값만 담는 read shape다 — 항목 선택 시 기존 `/spot/:id`로 진입한다(§5.1).
type LikedSpot {
  id: ID!
  title: String!
  thumbnailImageUrl: String!
  address: String
  category: SpotCategory!
  copyright: CopyrightType!
  attributionText: String!
}

type LikedSpotEdge {
  cursor: String!
  node: LikedSpot!
  # 좋아요 시각. 화면이 표시하지 않으므로(요구사항에 표시 요건 없음) 도메인 모델은
  # 이 값을 들고 있지 않다 — 정렬은 서버가 보장하고 클라이언트가 재정렬하지 않는다(§5.2).
  likedAt: String!
}

# totalCount는 **없다.** 예전 이 SDL에 적혀 있었으나 라이브 서버에 존재하지 않아
# 걷었다(2026-08-29 확인 — `FieldUndefined`). 조회하는 오퍼레이션이 없어 영향은
# 없었지만, 없는 필드를 적어 두면 다음 사람이 그것을 근거로 배선한다.
type LikedSpotConnection {
  edges: [LikedSpotEdge!]!
  pageInfo: PageInfo!
}

# ── SPEC-0013 검색 · Popular ──────────────────────────────────────────────
#
# 라이브 introspection 스냅샷에서 손으로 추린 것이며 `Specs/SPEC-0013/contract.graphql`
# (제안)이 아니다. **제안과 두 곳이 다르다**:
#   1. FestivalConnection·PopularSpotConnection에 totalCount가 없다.
#   2. searchSpots가 **오프셋 페이징**이다(제안은 커서). 커서 방식이 서버에서 정확히
#      동작하지 않아 전환됐고, SpotSearchEdge도 함께 사라졌다.

# 검색 payload. 입력 검증 실패를 최상위 errors[]가 아니라 데이터로 돌려준다(POL-015).
# connection은 항상 존재하며, 검증 실패 시 비어 있다.
type SpotSearchPayload {
  success: Boolean!
  userErrors: [UserError!]!
  connection: SpotSearchConnection!
}

# **오프셋 페이징이다.** 초안은 커서였으나 서버가 커서 방식에서 정확히 동작하지
# 않아 offset(page/size)으로 전환했다 — 기존 `spots`와 같은 모양이 됐다.
# `SpotSearchEdge`는 그와 함께 서버에서 사라졌다.
type SpotSearchConnection {
  items: [Spot!]!
  page: Int!
  hasNext: Boolean!
  # 검색 페이지가 결과 건수를 표시하므로 non-null이다.
  totalCount: Int!
}

# 자동완성 항목. 제안 목록에 필요한 최소 형태이며 거리·주소를 담지 않는다.
type SpotSuggestion {
  id: ID!
  title: String!
  category: SpotCategory!
}

type PopularSpotConnection {
  edges: [PopularSpotEdge!]!
  pageInfo: PageInfo!
}

type PopularSpotEdge {
  node: Spot!
  cursor: String!
  # 랭킹 근거. Spot 자체에 두지 않는 이유는 순위와 무관한 다른 조회에서는
  # 의미가 없기 때문이다.
  likeCount: Int!
}

# ── SPEC-0035 내 주변 추천 피드 ────────────────────────────────────────────
#
# `Specs/SPEC-0035/contract.graphql`(제안)에서 옮겼다. **라이브 스키마로 확인하지
# 못했다**(2026-09-11) — 서버 S1이 아직 배포되지 않았고 로컬 서버도 내려가 있었다.
# 서버가 배포되면 §13 스윕으로 대조하고, 어긋나면 이 사본을 서버 기준으로 고친다.
#
# `Location`·`SpotConnection`·`SpotEdge`는 **여기에만 한 번** 둔다. codegen이 모든
# 조각을 하나로 병합하므로 커뮤니티 조각이 다시 정의하면 충돌한다 — 커뮤니티의
# `NearbySpots`는 병합된 타입을 그대로 쓴다.

# 좌표 한 점이 소유하는 보기들. 같은 후보 집합(반경 안 spot)을 다른 순서로 본다.
# 로그인 호출자는 두 보기 모두에서 이미 반응(좋아요·싫어요)한 spot이 제외된다.
#
# **id가 없는 가상 노드다.** 다시 볼 때는 좌표를 다시 준다. 공용 클라이언트는
# 정규화 캐시를 쓰지 않으므로(`build.yaml` `addTypename: false`) 문제없다.
type Location {
  # 거리 오름차순(동거리는 id 오름차순). `Query.spots`와 같은 결과·같은 검증이며
  # 페이지만 커서다. 커서는 (거리, id) 키셋이라 같은 조건에서 중복·누락 없이 이어진다.
  # 손상·불일치는 INVALID_CURSOR.
  spots(
    # 기본 20000, 최대 100000 — 초과 시 RADIUS_TOO_LARGE.
    radiusMeters: Int = 20000
    # 다중 필터(OR). 생략·null이면 전 카테고리. 빈 배열은 EMPTY_CATEGORY_SET.
    categories: [String!]
    # 기본 20, 상한 100 — 초과 시 절삭된다.
    first: Int = 20
    after: String
  ): SpotConnection!
  # 추천 순 + 다양성. 점수의 요인 구성은 서버 내부다.
  #
  # 커서는 첫 요청의 조건(반경·카테고리·언어·좌표)에 묶인다. 조건이 바뀐 채 이어
  # 받으면 INVALID_CURSOR, 수명을 넘기면 CURSOR_EXPIRED — 두 경우 모두 after 없이
  # 새로 시작한다. 총 개수는 제공하지 않는다(popularSpots·likedSpots와 같은 규약).
  recommendedSpots(
    radiusMeters: Int = 20000
    categories: [String!]
    first: Int = 20
    after: String
  ): SpotConnection!
}

# Spot 커서 연결. 총 개수는 제공하지 않는다.
type SpotConnection {
  edges: [SpotEdge!]!
  pageInfo: PageInfo!
}

# Spot 커서 항목 1건. Spot을 그대로 재사용하며 랭킹 근거 필드는 두지 않는다.
type SpotEdge {
  node: Spot!
  cursor: String!
}

input ReactToSpotInput {
  catalogId: ID!
  reaction: SpotReaction!
}

type ReactToSpotPayload {
  success: Boolean!
  userErrors: [UserError!]!
}

# auth_schema.graphql가 base Query/Mutation를 소유하므로 여기선 extend로 이어 붙인다
# (graphql_codegen은 모든 스키마 파일을 하나로 병합한다 — 중복 정의 시 충돌).
extend type Query {
  # SPEC-0035로 **deprecated**. 이 저장소에는 더 이상 부르는 오퍼레이션이 없다 —
  # `query Spots`·`fetchSpotPage`는 같은 스펙에서 제거했고, 홈·Discover는
  # `location.recommendedSpots`, 장소 선택 시트는 `location.spots`를 쓴다.
  # 필드 자체는 배포된 앱이 쓰므로 서버가 남겨 둔다(제거는 별도 결정).
  spots(
    latitude: Float!
    longitude: Float!
    radiusMeters: Int
    # SPEC-0020 R5: 다중 선택. code 문자열 배열이며 OR로 걸린다. 생략은 "전체",
    # 빈 배열은 서버 오류(EmptyCategorySetException)다.
    categories: [String!]
    page: Int
    size: Int
  ): SpotPage! @deprecated(reason: "location.spots — 같은 결과를 커서로 준다")
  # SPEC-0035. 지도 위 한 점. 좌표로 정해지는 맥락이며 그 주변을 보는 필드들을
  # 소유한다. 좌표 검증은 spots와 같다(범위 밖이면 같은 오류 코드). 언어는
  # Accept-Language로 정해진다(다른 조회와 동일, locale 인자 없음).
  location(latitude: Float!, longitude: Float!): Location!
  availableSpotCategories: [SpotCategory!]!
  # contentId(=Spot.id) 단건 상세 조회. 로케일은 Accept-Language 헤더로 전달(SPEC-0002
  # 규약) — 로케일 인자 없음. 유효 id는 항상 SpotDetail을 반환하고, 해소 실패는 최상위
  # errors[](SPOT_NOT_FOUND)이므로 non-null. 라이브 스키마 확인됨.
  spotDetail(id: ID!): SpotDetail!
  # SPEC-0008 R-18. 미인증이면 최상위 errors[]에 UNAUTHENTICATED가 실려 SPEC-0005의
  # 세션 갱신 경로를 탄다 — 이 스펙이 별도 처리를 더하지 않는다(§5.2).
  # categories 생략 = "전체"다(Discover의 spots와 같은 규약). 필터링은 서버가
  # 하고 클라이언트는 받은 페이지를 그대로 잇는다.
  likedSpots(
    categories: [String!]
    first: Int
    after: String
  ): LikedSpotConnection!
  # SPEC-0033 목록 내 검색. **`likedSpots`의 인자가 아니라 별개의 쿼리다** — 서버가
  # 그렇게 냈다(라이브 스키마 확인 2026-08-29). `query`가 **non-null 필수**라
  # "생략 = 필터 없음"이 없고, 호출부가 검색어 유무로 두 쿼리를 가른다.
  #
  # 반환은 `likedSpots`와 같은 LikedSpotConnection!이며 정렬도 likedAt DESC 그대로다
  # (searchSpots의 관련도 정렬과 다르다). EMPTY_QUERY·QUERY_TOO_LONG은 payload 래퍼
  # 없이 최상위 errors[]로 온다 — searchSpots의 userErrors[]와 통로가 다르다.
  searchLikedSpots(
    query: String!
    categories: [String!]
    first: Int
    after: String
  ): LikedSpotConnection!
  # SPEC-0013 R1–R8. 반경 내 spot을 제목·주소 대상 BM25 관련도 순으로 검색한다.
  # 정렬은 계약이다(POL-019) — 관련도를 거리로 가중하고 동점은 id 오름차순.
  # 결과 0건은 정상이며, 빈/과길이 질의는 userErrors로 거절된다.
  #
  # **오프셋 페이징**(page/size) — 커서에서 전환됐다.
  searchSpots(
    query: String!
    latitude: Float!
    longitude: Float!
    radiusMeters: Int
    categories: [String!]
    page: Int
    size: Int
  ): SpotSearchPayload!
  # SPEC-0013 R9. 제목 접두 자동완성. 페이지네이션하지 않는다 — 지연에 민감한
  # 입력 보조 수단이다. 빈 질의는 오류가 아니라 빈 목록이다.
  spotSearchSuggestions(
    query: String!
    latitude: Float!
    longitude: Float!
    radiusMeters: Int
    limit: Int
  ): [SpotSuggestion!]!
  # SPEC-0013 R18. 반경 내 spot을 좋아요 수 내림차순으로. 10개 미만은 제외되며,
  # 조건을 만족하는 spot이 0건인 것은 정상 상태다.
  popularSpots(
    latitude: Float!
    longitude: Float!
    radiusMeters: Int
    categories: [String!]
    first: Int
    after: String
  ): PopularSpotConnection!
}

extend type Mutation {
  reactToSpot(input: ReactToSpotInput!): ReactToSpotPayload!
}
