# SPEC-0002 spots 슬라이스가 쓰는 서버 스키마 조각(committed codegen 입력).
# `schema/schema.introspection.json` 스냅샷에서 손으로 추린 안정 빌드 입력이며,
# gitignore된 스냅샷을 codegen이 직접 읽지 않는다(CLAUDE.md §13).

enum SpotCategory {
  TOURIST_SPOT
  CULTURAL_FACILITY
  FESTIVAL_EVENT
  TRAVEL_COURSE
  LEISURE_SPORTS
  LODGING
  SHOPPING
  RESTAURANT
  TRANSPORT
}

enum CopyrightType {
  TYPE1
  TYPE3
  UNSPECIFIED
}

enum SpotReaction {
  LIKE
  DISLIKE
}

type Spot {
  id: ID!
  title: String!
  address: String
  thumbnailImageUrl: String!
  distanceMeters: Float!
  category: SpotCategory!
  copyright: CopyrightType!
  attributionText: String!
  mapX: Float!
  mapY: Float!
}

type SpotPage {
  items: [Spot!]!
  page: Int!
  hasNext: Boolean!
  totalCount: Int
}

# SPEC-0003 상세 전용 read shape. contract.graphql(제안)에서 옮긴 committed codegen
# 입력이다. 라이브 서버가 아직 spotDetail을 서빙하지 않으므로(스냅샷 확인) 이 조각은
# codegen 입력으로만 쓰이고, 실제 쿼리는 서버 이슈 #23이 spotDetail을 올린 뒤 동작한다.

# 갤러리 이미지 한 장. TourAPI detailImage2가 이미지별 cpyrhtDivCd를 주므로
# 저작권/문구는 이미지별이며 부모 Spot에서 상속하지 않는다.
type SpotImage {
  imageUrl: String!
  thumbnailUrl: String
  caption: String
  copyright: CopyrightType!
  attributionText: String!
}

# 상세 전용 반환 타입. Spot의 확장이 아니라 별도 shape다(어떤 인터페이스도 구현 안 함).
type SpotDetail {
  id: ID!
  title: String!
  category: SpotCategory!
  thumbnailImageUrl: String!
  overview: String
  address: String
  homepage: String
  tel: String
  copyright: CopyrightType!
  attributionText: String!
  gallery: [SpotImage!]!
  likeCount: Int!
}

input ReactToSpotInput {
  spotId: ID!
  reaction: SpotReaction!
}

type ReactToSpotPayload {
  success: Boolean!
  userErrors: [UserError!]!
}

# auth_schema.graphql가 base Query/Mutation를 소유하므로 여기선 extend로 이어 붙인다
# (graphql_codegen은 모든 스키마 파일을 하나로 병합한다 — 중복 정의 시 충돌).
extend type Query {
  spots(
    latitude: Float!
    longitude: Float!
    radiusMeters: Int
    category: SpotCategory
    page: Int
    size: Int
  ): SpotPage!
  availableSpotCategories: [SpotCategory!]!
  # contentId(=Spot.id) 단건 상세 조회. 로케일은 Accept-Language 헤더로 전달(SPEC-0002
  # 규약) — 로케일 인자 없음. 유효 id는 항상 SpotDetail을 반환하고, 해소 실패는 최상위
  # errors[](SPOT_NOT_FOUND)이므로 non-null.
  spotDetail(id: ID!): SpotDetail!
}

extend type Mutation {
  reactToSpot(input: ReactToSpotInput!): ReactToSpotPayload!
}
