# SPEC-0026 장소 질문/답변 오퍼레이션. 생성 타입은 이 repository 밖으로 나가지
# 않는다(POL-020).
#
# 사진 첨부는 서버에 업로드 뮤테이션이 없어 이번 범위에서 빠졌다(스키마 조각 상단 참고).
# 작성 뮤테이션의 `photoKeys`는 실재하는 인자라 그대로 두고 빈 목록을 보낸다 — 서버가
# 업로드를 구현하면 오퍼레이션은 손대지 않고 값만 채우면 된다.

fragment SpotQaAuthorParts on PostAuthor {
  id
  nickname
  profileImageUrl
}

fragment SpotQaSpotParts on PostSpot {
  id
  title
  thumbnailImageUrl
  category
}

fragment SpotQuestionParts on SpotQuestion {
  id
  spot {
    ...SpotQaSpotParts
  }
  body
  author {
    ...SpotQaAuthorParts
  }
  photoKeys
  resolved
  answerCount
  ownedByViewer
  hidden
  createdAt
}

# 답글에는 `replies`가 없다 — 답글에 답글을 달 수 없다는 R7의 타입 수준 표현이다.
fragment SpotAnswerReplyParts on SpotAnswerReply {
  id
  answerId
  body
  author {
    ...SpotQaAuthorParts
  }
  photoKeys
  ownedByViewer
  hidden
  createdAt
}

fragment SpotAnswerParts on SpotAnswer {
  id
  questionId
  body
  author {
    ...SpotQaAuthorParts
  }
  photoKeys
  ownedByViewer
  hidden
  createdAt
  replies {
    ...SpotAnswerReplyParts
  }
}

# 정렬 인자가 없다 — 미해결 우선·최신순은 서버가 고정한다(R2).
query SpotQuestions($catalogId: ID, $first: Int, $after: String) {
  spotQuestions(catalogId: $catalogId, first: $first, after: $after) {
    edges {
      cursor
      node {
        ...SpotQuestionParts
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# 내가 쓴 질문(2026-08-18 서버가 `mine` 필터를 더했다 — 새 루트를 만들지 않았다).
#
# **인증 필수다.** 비로그인이면 최상위 errors로 실패하며 빈 목록이 아니다 — 조용히
# 비우면 "쓴 적 없음"으로 오해된다.
query MyQuestions($first: Int, $after: String) {
  spotQuestions(mine: true, first: $first, after: $after) {
    edges {
      cursor
      node {
        ...SpotQuestionParts
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# id로 집어 오는 조회(딥링크·알림 진입). 단건 루트 대신 `ids` 필터를 쓴다.
#
# **가려진 id는 빠진다** — 차단·숨김·삭제면 결과에 없다. 요청한 수보다 적게 오는 것이
# 정상이고, 비어 오면 "없거나 볼 수 없음"이지 오류가 아니다.
#
# `ids: []`를 넘기면 "결과 없음"이다(전체가 아니다) — 호출부가 빈 목록을 넘기지 않도록
# 주의한다.
query SpotQuestionsByIds($ids: [ID!], $first: Int) {
  spotQuestions(ids: $ids, first: $first) {
    edges {
      cursor
      node {
        ...SpotQuestionParts
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query SpotAnswers($questionId: ID!, $first: Int, $after: String) {
  spotAnswers(questionId: $questionId, first: $first, after: $after) {
    edges {
      cursor
      node {
        ...SpotAnswerParts
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# 자격 없음은 `userErrors`의 NOT_ELIGIBLE_TO_ASK로 온다 — 최상위 errors가 아니다.
# 화면을 닫지 않고 안내만 띄워 입력을 보존한다.
mutation CreateSpotQuestion(
  $catalogId: ID!
  $body: String!
  $photoKeys: [String!]!
) {
  createSpotQuestion(
    input: { catalogId: $catalogId, body: $body, photoKeys: $photoKeys }
  ) {
    success
    userErrors {
      code
      field
      message
    }
    questionId
  }
}

mutation DeleteSpotQuestion($questionId: ID!) {
  deleteSpotQuestion(input: { questionId: $questionId }) {
    success
    userErrors {
      code
      field
      message
    }
  }
}

# 해결 여부를 바꾼다. **되돌릴 수 있다** — `resolved: false`로 미해결로 돌린다.
mutation ResolveSpotQuestion($questionId: ID!, $resolved: Boolean!) {
  resolveSpotQuestion(input: { questionId: $questionId, resolved: $resolved }) {
    success
    userErrors {
      code
      field
      message
    }
  }
}

mutation CreateSpotAnswer(
  $questionId: ID!
  $body: String!
  $photoKeys: [String!]!
) {
  createSpotAnswer(
    input: { questionId: $questionId, body: $body, photoKeys: $photoKeys }
  ) {
    success
    userErrors {
      code
      field
      message
    }
    answerId
  }
}

mutation DeleteSpotAnswer($answerId: ID!) {
  deleteSpotAnswer(input: { answerId: $answerId }) {
    success
    userErrors {
      code
      field
      message
    }
  }
}

mutation CreateSpotAnswerReply(
  $parentAnswerId: ID!
  $body: String!
  $photoKeys: [String!]!
) {
  createSpotAnswerReply(
    input: {
      parentAnswerId: $parentAnswerId
      body: $body
      photoKeys: $photoKeys
    }
  ) {
    success
    userErrors {
      code
      field
      message
    }
    replyId
  }
}

mutation DeleteSpotAnswerReply($replyId: ID!) {
  deleteSpotAnswerReply(input: { replyId: $replyId }) {
    success
    userErrors {
      code
      field
      message
    }
  }
}
