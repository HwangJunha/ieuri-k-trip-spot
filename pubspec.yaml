          weight: 300
        - asset: asset/fonts/Latin/NotoSans-Regular.ttf
          weight: 400
        - asset: asset/fonts/Latin/NotoSans-Medium.ttf
          weight: 500
        - asset: asset/fonts/Latin/NotoSans-SemiBold.ttf
          weight: 600
        - asset: asset/fonts/Latin/NotoSans-Bold.ttf
          weight: 700
        - asset: asset/fonts/Latin/NotoSans-ExtraBold.ttf
          weight: 800
        - asset: asset/fonts/Latin/NotoSans-Black.ttf
          weight: 900
        - asset: asset/fonts/Latin/NotoSans-Italic.ttf
          weight: 400
          style: italic
        - asset: asset/fonts/Latin/NotoSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: asset/fonts/Latin/NotoSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: asset/fonts/Latin/NotoSans-BoldItalic.ttf
          weight: 700
