name: ieuri_k_trip_spot
description: "Real-time, location-based tourism app for foreign visitors to Korea."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (Riverpod 3, code generation)
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # Routing
  go_router: ^14.0.0

  # i18n
  intl: any

  # SVG logo / icon rendering
  flutter_svg: ^2.0.10

  # Local (non-secret) persistence: locale + onboarding flag
  shared_preferences: ^2.3.0

  # 앱 전용 디렉토리 — 초안 사진 바이트를 파일로 둔다(SPEC-0022 §2).
  # 사진 5장이면 최대 50MiB라 shared_preferences에 담을 수 없다.
  path_provider: ^2.1.4

  # GraphQL data layer (repository only)
  graphql_flutter: ^5.1.2
  # DocumentNode type for the graphql_codegen-generated operations (repo only)
  gql: any
  # HttpLink에 응답 시한을 거는 http.BaseClient용 (common/network 전용)
  http: ^1.6.0
  # 동의 창 없이 google server auth code를 묻기 위한 저수준 API.
  # google_sign_in의 authorizeServer()는 prompt를 강제해 창이 두 번 뜬다(SPEC-0012).
  google_sign_in_platform_interface: ^3.1.0

  # Secure storage for tokens (via common/storage wrapper only)
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  kakao_flutter_sdk_user: ^2.0.0+1
  permission_handler: ^12.0.3

  # Device GPS coordinates for the location-based spot feed (SPEC-0002)
  geolocator: ^13.0.1
  url_launcher: ^6.3.2
  # 사진 첨부(SPEC-0010). Flutter 팀이 관리하는 사실상 표준이며, 업로드는 이 패키지가
  # 준 바이트를 그대로 스토리지로 PUT한다 — 리사이즈·재인코딩을 하면 1단계에 선언한
  # contentLength와 어긋나 서명이 깨진다(가이드 §4).
  image_picker: ^1.2.3
  kakao_map_sdk: ^1.2.6

  # FCM 푸시 알림(SPEC-0028). **설정 파일이 없어도 앱은 기동된다** — Android는
  # google-services.json이 있을 때만 Gradle 플러그인이 붙고(android/app/build.gradle.kts),
  # 초기화가 실패하면 `PushInitializer`가 삼켜 알림만 빠진다. 알림을 못 받는 것이
  # 앱을 막을 이유가 되지 않는다(설계 §9 · R14).
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  # 사용량 집계(DAU·MAU·유지율). 푸시와 같은 Firebase 앱을 쓰므로 설정 파일이 없으면
  # 함께 조용히 빠진다 — `AnalyticsInitializer`가 `PushInitializer`와 같은 규칙이다.
  #
  # **11.x에 고정돼 있다.** 12.x는 `firebase_core ^4`를 요구하는데, core를 올리면
  # `firebase_messaging`까지 연쇄로 올려야 한다. 출시 직전에 푸시를 건드릴 이유가
  # 없어 core 3.x와 맞는 마지막 버전을 쓴다(2026-08-25).
  firebase_analytics: ^11.6.0
  # Android 알림 채널 2개와 포그라운드 표시 억제(설계 §5·§6). 서버가 채널을 지정하지
  # 않으므로 클라이언트가 만든다(서버 안내 §1).
  flutter_local_notifications: ^18.0.1
  photo_manager: ^3.12.0
  share_plus: ^12.0.2
  webview_flutter: ^4.14.1
  logger: ^2.7.0

  # 로딩 중 시머 스켈레톤. **이미 만든 위젯 트리를 그대로 뼈대로 바꾼다** — 화면마다
  # 스켈레톤 레이아웃을 따로 그리지 않아도 되므로, 목록 카드가 바뀌어도 스켈레톤이
  # 저절로 따라간다(손으로 그린 스켈레톤은 반드시 실제 화면과 어긋난다).
  # 의존성이 flutter SDK 하나뿐이라 추가 부담이 없다.
  skeletonizer: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Riverpod codegen
  build_runner: ^2.4.13
  riverpod_generator: ^3.0.0

  # GraphQL typed operation codegen (repository only)
  graphql_codegen: ^3.0.2

  # Native splash generation
  flutter_native_splash: ^2.4.0

  # E2E: journeys that stay inside the widget tree (bundled with the SDK).
  # 현재 상시 e2e 여정은 없다 — 검증은 유닛·위젯 테스트가 맡는다(CLAUDE.md §8).
  # SDK 번들이라 유지 비용이 없어, 여정을 추가할 때 바로 쓸 수 있게 남겨둔다.
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - asset/icon/
    - asset/icon/landmark/
    # **폴더가 아니라 파일을 하나씩 싣는다.** `asset/geo/`로 두면 같은 폴더의
    # `README.md`(내부 설계 메모 — SPEC·정책 번호가 적혀 있다)까지 앱에 딸려
    # 들어간다. 실제로 릴리스 APK에 들어가 있던 것을 확인하고 좁혔다.
    #
    # **geo에 자산을 추가하면 여기에도 줄을 추가해야 한다.** 폴더 선언이 아니라
    # 빠뜨리면 조용히 누락된다 — `cell-shapes.json`은 로더가 try/catch로 빈 값을
    # 돌려주므로 특히 티가 안 난다.
    - asset/geo/district-boundaries.geojson

    # 온보딩 다섯 장의 일러스트(2026-08-25). 탭 순서와 파일명이 1:1이라 화면이
    # 늘거나 줄면 여기도 함께 본다.
    #
    # **폴더로 선언한다** — geo와 달리 이 폴더에는 설계 메모가 없고 파일이 전부
    # 앱에 필요하다. 다섯 장 합쳐 204KB다.
    - asset/onboarding/

  fonts:
    # Base multilingual family. Latin/KO glyphs from Noto Sans;
    # CJK fallbacks (KR/JP/SC) are declared as separate families and
    # wired via fontFamilyFallback in AppTheme.
    #
    # **웨이트는 400/500/600/700/800 다섯 종만 싣는다**(2026-08-25).
    # 코드가 실제로 쓰는 것이 그게 전부다 — `FontWeight.w500`(2곳)·`w600`(20곳)·
    # `w700`(21곳)·`w800`(1곳)·`bold`(1곳)이고, 나머지는 본문 기본값 400이다.
    # Thin(100)·ExtraLight(200)·Light(300)·Black(900)은 **한 번도 쓰이지 않았다.**
    #
    # 지우기 전에는 선언된 폰트가 40개 198.5MB였고, CJK 한 종이 5~10MB다.
    # **안드로이드에서 이 무게가 그대로 초기 버벅임이 된다** — APK는 폰트를
    # deflate로 넣는데(`unzip -v`로 확인: 폰트는 `Defl:N`, `libapp.so`는 `Stored`)
    # Android `AssetManager`는 압축된 asset을 mmap하지 못해 **쓸 때마다 통째로
    # 메모리에 푼다.** iOS는 `.app` 안에 압축 없이 들어가 mmap되므로 실제로 읽히는
    # 것은 글리프가 있는 페이지뿐이다 — 같은 폰트인데 비용이 구조적으로 다르고,
    # "아이폰은 괜찮은데 안드로이드만 처음에 느리다"가 정확히 여기서 나온다.
    #
    # 폴백 체인이 KR→JP→SC라(`app_theme.dart`) 한국어 기기는 스플래시 첫 프레임부터
    # CJK를 건드린다. 한 번 로드되면 엔진이 캐시하므로 그 뒤로는 공짜다 —
    # "시간이 지나면 괜찮아진다"도 같은 이유다.
    #
    # **이탤릭은 남긴다** — `area_info_card.dart`·`message_bubble.dart`가 쓴다.
    - family: NotoSans
      fonts:
        - asset: asset/fonts/Latin/NotoSans-Regular.ttf
          weight: 400
        - asset: asset/fonts/Latin/NotoSans-Medium.ttf
          weight: 500
        - asset: asset/fonts/Latin/NotoSans-SemiBold.ttf
          weight: 600
        - asset: asset/fonts/Latin/NotoSans-Bold.ttf
          weight: 700
        - asset: asset/fonts/Latin/NotoSans-ExtraBold.ttf
          weight: 800
        - asset: asset/fonts/Latin/NotoSans-Italic.ttf
          weight: 400
          style: italic
        - asset: asset/fonts/Latin/NotoSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: asset/fonts/Latin/NotoSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: asset/fonts/Latin/NotoSans-BoldItalic.ttf
          weight: 700
          style: italic
    - family: NotoSansKR
      fonts:
        - asset: asset/fonts/KR/NotoSansKR-Regular.ttf
          weight: 400
        - asset: asset/fonts/KR/NotoSansKR-Medium.ttf
          weight: 500
        - asset: asset/fonts/KR/NotoSansKR-SemiBold.ttf
          weight: 600
        - asset: asset/fonts/KR/NotoSansKR-Bold.ttf
          weight: 700
        - asset: asset/fonts/KR/NotoSansKR-ExtraBold.ttf
          weight: 800
    - family: NotoSansJP
      fonts:
        - asset: asset/fonts/JP/NotoSansJP-Regular.ttf
          weight: 400
        - asset: asset/fonts/JP/NotoSansJP-Medium.ttf
          weight: 500
        - asset: asset/fonts/JP/NotoSansJP-SemiBold.ttf
          weight: 600
        - asset: asset/fonts/JP/NotoSansJP-Bold.ttf
          weight: 700
        - asset: asset/fonts/JP/NotoSansJP-ExtraBold.ttf
          weight: 800
    - family: NotoSansSC
      fonts:
        - asset: asset/fonts/SC/NotoSansSC-Regular.ttf
          weight: 400
        - asset: asset/fonts/SC/NotoSansSC-Medium.ttf
          weight: 500
        - asset: asset/fonts/SC/NotoSansSC-SemiBold.ttf
          weight: 600
        - asset: asset/fonts/SC/NotoSansSC-Bold.ttf
          weight: 700
        - asset: asset/fonts/SC/NotoSansSC-ExtraBold.ttf
          weight: 800

# Native splash: coral brand background (matches the in-app splash).
# Logo mark needs a PNG export — follow-up.
flutter_native_splash:
  color: "#EA4A3F"
  color_dark: "#EA4A3F"
  android_12:
    color: "#EA4A3F"
    color_dark: "#EA4A3F"
