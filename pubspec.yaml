    - family: NotoSansKR
      fonts:
        - asset: asset/fonts/KR/NotoSansKR-Thin.ttf
          weight: 100
        - asset: asset/fonts/KR/NotoSansKR-ExtraLight.ttf
          weight: 200
        - asset: asset/fonts/KR/NotoSansKR-Light.ttf
          weight: 300
        - asset: asset/fonts/KR/NotoSansKR-Regular.ttf
          weight: 400
        - asset: asset/fonts/KR/NotoSansKR-Medium.ttf
          weight: 500
        - asset: asset/fonts/KR/NotoSansKR-SemiBold.ttf
          weight: 600
        - asset: asset/fonts/KR/NotoSansKR-Bold.ttf
          weight: 700
        - asset: asset/fonts/KR/NotoSansKR-ExtraBold.ttf
          weight: 800
        - asset: asset/fonts/KR/NotoSansKR-Black.ttf
          weight: 900
    - family: NotoSansJP
      fonts:
        - asset: asset/fonts/JP/NotoSansJP-Thin.ttf
          weight: 100
        - asset: asset/fonts/JP/NotoSansJP-ExtraLight.ttf
          weight: 200
        - asset: asset/fonts/JP/NotoSansJP-Light.ttf
          weight: 300
        - asset: asset/fonts/JP/NotoSansJP-Regular.ttf
          weight: 400
        - asset: asset/fonts/JP/NotoSansJP-Medium.ttf
          weight: 500
        - asset: asset/fonts/JP/NotoSansJP-SemiBold.ttf
          weight: 600
        - asset: asset/fonts/JP/NotoSansJP-Bold.ttf
          weight: 700
        - asset: asset/fonts/JP/NotoSansJP-ExtraBold.ttf
          weight: 800
        - asset: asset/fonts/JP/NotoSansJP-Black.ttf
          weight: 900
    - family: NotoSansSC
      fonts:
        - asset: asset/fonts/SC/NotoSansSC-Thin.ttf
          weight: 100
        - asset: asset/fonts/SC/NotoSansSC-ExtraLight.ttf
          weight: 200
        - asset: asset/fonts/SC/NotoSansSC-Light.ttf
          weight: 300
        - asset: asset/fonts/SC/NotoSansSC-Regular.ttf
          weight: 400
        - asset: asset/fonts/SC/NotoSansSC-Medium.ttf
          weight: 500
        - asset: asset/fonts/SC/NotoSansSC-SemiBold.ttf
          weight: 600
        - asset: asset/fonts/SC/NotoSansSC-Bold.ttf
